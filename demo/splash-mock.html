<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Splash mock</title>
<style>
  html, body { margin: 0; }
  body {
    background: #07040f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #8f83c4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .phone {
    width: 360px; height: 640px; border-radius: 40px;
    background: radial-gradient(120% 70% at 50% 38%, #1a1130 0%, #0b0618 55%, #05020d 100%);
    border: 1px solid rgba(140,110,255,.18);
    box-shadow: 0 40px 90px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .phone::before {
    content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,80,255,.16) 0%, rgba(124,80,255,0) 70%);
    filter: blur(6px);
  }
  .icon { width: 132px; height: 132px; position: relative; filter: invert(1) drop-shadow(0 0 30px rgba(140,95,255,.55)); }
  .cap { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .sub { font-size: 12px; opacity: .45; margin-top: -8px; }
</style>
</head>
<body>
  <div class="phone"><img class="icon" src="../assets/splash-icon.svg" alt=""></div>
  <div class="cap">Splash screen · иконка в цвете акцента</div>
  <div class="sub">в светлой теме Telegram иконка будет чёрной на светлом фоне</div>
</body>
</html>
