<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>АККРЕЦИЯ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#02010a;color:#e8e2ff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hud{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  padding:12px;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.spacer{flex:1;pointer-events:none!important}
.panel{background:linear-gradient(180deg,rgba(15,10,32,.72),rgba(10,5,20,.5));
  border:1px solid rgba(139,127,212,.20);border-radius:14px;padding:11px 14px;
  backdrop-filter:blur(14px)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.tag{font-size:9px;letter-spacing:3px;color:#8b7fd4}
.scale{font-size:9px;letter-spacing:2px;color:#b9a8ff;font-weight:600}
.pname{font-size:14px;font-weight:700;margin-top:3px;
  background:linear-gradient(90deg,#fff,#b9a8ff);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.pdesc{font-size:10px;color:#a89ce0;margin-top:5px;line-height:1.4}
.goal{margin-top:9px}
.goal-text{font-size:9px;color:#8b7fd4;display:flex;justify-content:space-between}
.bar{height:4px;background:rgba(139,127,212,.15);border-radius:2px;
  overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:linear-gradient(90deg,#6b4de6,#b9a8ff);
  transition:width .3s;box-shadow:0 0 10px rgba(139,127,212,.7)}
.eta{font-size:9px;color:#8b7fd4;margin-top:4px;text-align:center;
  font-variant-numeric:tabular-nums}
.dust-panel{background:linear-gradient(180deg,rgba(15,10,32,.72),rgba(10,5,20,.5));
  border:1px solid rgba(139,127,212,.20);border-radius:14px;padding:10px 14px;
  backdrop-filter:blur(14px);text-align:center}
.dust-label{font-size:9px;letter-spacing:3px;color:#8b7fd4}
.dust-val{font-size:24px;font-weight:800;margin-top:1px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#b9a8ff);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.dust-rate{font-size:10px;color:#8b7fd4;margin-top:1px;
  font-variant-numeric:tabular-nums}
.evolve-btn{background:linear-gradient(135deg,#6b4de6,#8b5cf6);
  border:none;border-radius:14px;padding:14px;font-family:inherit;
  color:#fff;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;
  box-shadow:0 8px 40px rgba(107,77,230,.6),0 0 0 0 rgba(185,168,255,.5);
  animation:evolvePulse 1.6s infinite;text-transform:uppercase;display:none}
.evolve-btn.show{display:block}
@keyframes evolvePulse{
  0%,100%{box-shadow:0 8px 40px rgba(107,77,230,.6),0 0 0 0 rgba(185,168,255,.5)}
  50%{box-shadow:0 8px 40px rgba(107,77,230,.6),0 0 0 16px rgba(185,168,255,0)}}
.launch-row{display:flex;gap:6px}
.launch-btn{flex:1;border:none;border-radius:12px;padding:10px 8px;
  font-family:inherit;color:#fff;font-size:11px;font-weight:600;
  cursor:pointer;transition:transform .08s;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;
  justify-content:center}
.launch-btn:active:not(:disabled){transform:scale(.96)}
.launch-btn:disabled{opacity:.45;cursor:not-allowed}
.launch-btn.exp{background:linear-gradient(135deg,#1a6b4a,#2eaa77)}
.launch-btn.cmt{background:linear-gradient(135deg,#2a3b8e,#3d6dd4)}
.launch-icon{font-size:16px}
.launch-sub{font-size:9px;opacity:.85;font-variant-numeric:tabular-nums}
.toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;z-index:20;pointer-events:none;
  max-width:90vw}
.toast{background:rgba(25,15,55,.95);border:1px solid rgba(185,168,255,.4);
  border-radius:11px;padding:9px 15px;font-size:11.5px;color:#e8e2ff;
  animation:toastIn 3.5s ease forwards;text-align:center;backdrop-filter:blur(8px)}
.toast b{display:block;margin-bottom:1px;font-size:12px;font-weight:700}
.toast.good b{color:#5ee0a0}
.toast.bad b{color:#ff5e5e}
.toast.info b{color:#ffb347}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}
  12%,82%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-10px)}}
.modal{position:fixed;inset:0;background:rgba(2,1,10,.9);z-index:30;
  display:none;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(10px)}
.modal.show{display:flex;animation:modalIn .35s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-card{background:linear-gradient(180deg,rgba(25,15,50,.98),rgba(12,8,26,.98));
  border:1px solid rgba(139,127,212,.35);border-radius:20px;padding:20px;
  max-width:460px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 30px 100px rgba(107,77,230,.4)}
.modal-title{font-size:17px;font-weight:800;text-align:center;
  background:linear-gradient(90deg,#fff,#b9a8ff);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.modal-sub{font-size:11px;color:#8b7fd4;text-align:center;margin-top:5px;
  line-height:1.5;margin-bottom:14px}
.info-box{background:rgba(20,15,45,.6);border:1px solid rgba(139,127,212,.2);
  border-radius:12px;padding:14px;margin-bottom:14px;font-size:11px;
  color:#c8bde8;line-height:1.5}
.info-box b{color:#b9a8ff}
.info-box .row-stat{display:flex;justify-content:space-between;
  align-items:center;padding:6px 0;
  border-bottom:1px dashed rgba(139,127,212,.15);font-size:12px}
.info-box .row-stat:last-of-type{border-bottom:none}
.info-box .row-stat span:first-child{font-weight:600;color:#e8e2ff}
.info-box .row-stat span:last-child{color:#b9a8ff;font-weight:700}
.info-box .sub-desc{font-size:10px;color:#a89ce0;margin:2px 0 10px;
  padding-left:6px;line-height:1.4}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:rgba(15,10,32,.6);border:1px solid rgba(139,127,212,.22);
  border-radius:14px;padding:12px;cursor:pointer;font-family:inherit;
  color:#e8e2ff;text-align:left;transition:transform .1s,border-color .2s;
  display:flex;gap:11px;align-items:center}
.choice:active{transform:scale(.98);border-color:rgba(185,168,255,.7)}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice-icon{width:42px;height:42px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.choice-body{flex:1;min-width:0}
.choice-name{font-size:13.5px;font-weight:700}
.choice-desc{font-size:10px;color:#a89ce0;margin-top:3px;line-height:1.4}
.choice-stat{font-size:9.5px;color:#8b7fd4;margin-top:4px}
.choice-stat b{color:#b9a8ff}
.slider-wrap{background:rgba(15,10,32,.6);border:1px solid rgba(139,127,212,.22);
  border-radius:14px;padding:18px 16px 14px;margin-bottom:12px}
.slider-label{font-size:10px;color:#8b7fd4;text-align:center;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.slider-value{font-size:26px;font-weight:800;text-align:center;
  font-variant-numeric:tabular-nums;margin-bottom:12px;
  background:linear-gradient(180deg,#fff,#b9a8ff);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.limit-hint{text-align:center;font-size:9.5px;color:#8b7fd4;margin-top:6px;
  line-height:1.4}
.limit-hint b{color:#b9a8ff}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;
  background:transparent;height:28px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,#6b4de6,#b9a8ff)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;
  box-shadow:0 3px 12px rgba(139,127,212,.9),0 0 0 5px rgba(185,168,255,.25);
  cursor:pointer}
.stats-row{display:flex;justify-content:space-between;margin-top:14px;
  font-size:9.5px;color:#8b7fd4;text-align:center}
.stats-cell{flex:1}
.stats-cell b{display:block;color:#b9a8ff;font-size:13px;margin-top:3px;
  font-weight:700;font-variant-numeric:tabular-nums}
.confirm-btn{margin-top:14px;width:100%;padding:14px;border:none;
  border-radius:14px;font-family:inherit;color:#fff;font-size:13px;
  font-weight:700;letter-spacing:2px;cursor:pointer;text-transform:uppercase;
  background:linear-gradient(135deg,#6b4de6,#8b5cf6);
  box-shadow:0 8px 30px rgba(107,77,230,.5)}
.confirm-btn:active{transform:scale(.98)}
.cancel-btn{margin-top:6px;width:100%;padding:12px;
  border:1px solid rgba(139,127,212,.3);border-radius:14px;
  font-family:inherit;color:#8b7fd4;font-size:11px;background:transparent;
  cursor:pointer;font-weight:600}
.turbo{position:absolute;top:12px;right:12px;z-index:5;
  background:linear-gradient(135deg,#ff5e3a,#ff9500);border:none;
  border-radius:50%;width:34px;height:34px;color:#fff;font-size:15px;
  cursor:pointer;font-family:inherit;line-height:1;
  box-shadow:0 4px 16px rgba(255,120,60,.5)}
.turbo:active{transform:scale(.92)}
.missions{display:flex;flex-direction:column;gap:5px;pointer-events:none}
.mission{background:rgba(20,15,45,.85);border:1px solid rgba(139,127,212,.2);
  border-radius:10px;padding:7px 12px;font-size:10px;display:flex;
  justify-content:space-between;align-items:center;backdrop-filter:blur(8px)}
.mission-name{color:#b9a8ff;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.mission-time{color:#8b7fd4;font-variant-numeric:tabular-nums;white-space:nowrap}
.mission-bar{flex:1;margin:0 10px;height:2px;background:rgba(139,127,212,.2);
  border-radius:1px;overflow:hidden}
.mission-bar>div{height:100%;background:#b9a8ff;transition:width .3s}
.event-banner{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);
  z-index:15;border-radius:18px;padding:16px 24px;text-align:center;
  animation:eventIn 4s ease forwards;pointer-events:none;max-width:88vw}
.event-banner.danger{background:rgba(60,10,30,.95);border:2px solid #ff3b5c}
.event-banner.info{background:rgba(15,30,60,.95);border:2px solid #3b8fff}
.event-banner.good{background:rgba(10,50,30,.95);border:2px solid #2eaa77}
@keyframes eventIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  15%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.event-title{font-size:15px;font-weight:800;letter-spacing:1px}
.event-banner.danger .event-title{color:#ff3b5c}
.event-banner.info .event-title{color:#3b8fff}
.event-banner.good .event-title{color:#2eaa77}
.event-desc{font-size:11.5px;color:#e8c0c8;margin-top:5px;line-height:1.4}
.collapse-anim{text-align:center;padding:30px 0;font-size:44px;letter-spacing:10px}
.collapse-anim span{display:inline-block;animation:collapseDot 1.2s ease infinite}
.collapse-anim span:nth-child(2){animation-delay:.2s}
.collapse-anim span:nth-child(3){animation-delay:.4s}
@keyframes collapseDot{0%,100%{opacity:.3;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.3)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="sky"></canvas>
  <div class="hud">
    <div class="panel">
      <div class="top">
        <span class="tag" id="stageTag">ФАЗА I</span>
        <span class="scale" id="stageScale">ОБЛАКО</span>
      </div>
      <div class="pname" id="stageName">—</div>
      <div class="pdesc" id="stageDesc">—</div>
      <div class="goal">
        <div class="goal-text">
          <span id="goalLabel">—</span><span id="goalPct">0%</span>
        </div>
        <div class="bar"><div id="goalBar"></div></div>
        <div class="eta" id="etaText">—</div>
      </div>
    </div>
    <div class="missions" id="missions"></div>
    <div class="spacer"></div>
    <button class="evolve-btn" id="evolveBtn">Эволюция</button>
    <div class="launch-row" id="launchRow"></div>
    <div class="dust-panel">
      <div class="dust-label">ПЫЛЬ</div>
      <div class="dust-val" id="dustVal">0</div>
      <div class="dust-rate" id="dustRate">+0 / сек</div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <button class="turbo" id="turbo" title="Turbo (тест)">🚀</button>
</div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script>
'use strict';

const CFG = {
  eventInterval: 200,
  eventChance: 0.5,
  choiceEventInterval: 320,
  expeditionCooldown: 90000,
  cometCooldown: 60000,
  expeditionFlightBase: 180,
  cometFlightBase: 120,
  colonyChanceMax: 0.05,
  civGrowthPerPlanet: 0.02,
  collisionInterval: 60000,
  formationDuration: 600000,  // 10 минут
};

const STAGES = {
  cloud:      { tag:'ФАЗА I',   scale:'ОБЛАКО',  name:'Молекулярное облако',
                desc:'Холодная пыль дрейфует в пустоте. Частицы слипаются.',
                goal: 500, baseRate: 0.3, clickRate: 2, goalLabel: 'Накопи 500 пылинок' },
  condense:   { tag:'ФАЗА II',  scale:'ОБЛАКО',  name:'Уплотнение',
                desc:'Гравитация стягивает облако. Формируется плотное ядро.',
                goal: 25000, baseRate: 4, clickRate: 15, goalLabel: 'Накопи 25 000 пыли' },
  protostar:  { tag:'ФАЗА III', scale:'ЗВЕЗДА',  name:'Протозвезда',
                desc:'Ядро разогревается. Скоро запустится термоядерный синтез.',
                goal: 200000, baseRate: 35, clickRate: 100, goalLabel: 'Накопи 200 000 пыли' },
  firstPlanet:{ tag:'ФАЗА IV',  scale:'ЗВЕЗДА',  name:'Первая планета',
                desc:'Диск остывает. Пора сформировать первую планету.',
                goal: 800000, baseRate: 200, clickRate: 400, goalLabel: 'Накопи 800 000 пыли' },
  system:     { tag:'ФАЗА V',   scale:'СИСТЕМА', name:'Формирование системы',
                desc:'Каждая планета усложняет систему. Всего доступно 8 планет.',
                goal: null, baseRate: 800, clickRate: 1000, goalLabel: 'Формируй планеты' },
  galaxy:     { tag:'ФАЗА VI',  scale:'ГАЛАКТИКА', name:'Межзвёздная экспансия',
                desc:'Система зрелая. Строй новые звёзды и расширяй галактику.',
                goal: null, baseRate: 12000, clickRate: 3000, goalLabel: 'Расширяй галактику' },
};

const STAR_TYPES = {
  M:{name:'Красный карлик',color:8,sat:92,light:60,rateMult:6,civ:false,size:0.65,
     desc:'>56 млрд лет. Огромный пассив, но цивилизации невозможны.'},
  K:{name:'Оранжевый карлик',color:32,sat:88,light:68,rateMult:3,civ:true,maxCiv:7,size:0.85,
     desc:'17–40 млрд лет. Баланс дохода и жизни.'},
  G:{name:'Жёлтый карлик',color:50,sat:95,light:74,rateMult:1.5,civ:true,maxCiv:10,size:1.0,
     desc:'Аналог Солнца. Все ветки доступны.'},
  A:{name:'Белая звезда',color:210,sat:25,light:88,rateMult:2,civ:false,size:1.25,
     desc:'<7 млрд лет. Активное развитие, без цивилизаций.'},
  B:{name:'Голубая звезда',color:220,sat:78,light:78,rateMult:3.5,civ:false,size:1.6,
     desc:'<400 млн лет. Максимальная скорость.'},
};
const SYSTEM_TYPES = {
  single:  {name:'Одиночная', stars:1, rateMult:1.0, chance:0.50,
            collisionPerPlanet:0, civPassiveMult:1.0, civClickMult:1.0,
            icon:'⭐', color:'#6b4de6',
            desc:'Как Солнце. Стабильные орбиты, предсказуемое развитие.'},
  binary:  {name:'Двойная',   stars:2, rateMult:1.7, chance:0.38,
            collisionPerPlanet:0.003, civPassiveMult:0.65, civClickMult:3.0,
            icon:'✨', color:'#8b5cf6',
            desc:'Две звезды вокруг барицентра. Выше доход, но орбиты нестабильны.'},
  trinary: {name:'Кратная',   stars:3, rateMult:2.5, chance:0.12,
            collisionPerPlanet:0.010, civPassiveMult:0.40, civClickMult:6.0,
            icon:'💫', color:'#a855f7',
            desc:'Редкая система. Максимум энергии, но хаотичные орбиты.'},
};
const PLANET_TYPES = {
  rocky:      {name:'Каменная',       color:'#8a7159', civ:true,  rate:200,  desc:'Землеподобный мир. Основа для жизни.'},
  superEarth: {name:'Суперземля',     color:'#5a9c6e', civ:true,  rate:400,  desc:'Массивнее Земли. Ускоренная жизнь.'},
  iceGiant:   {name:'Ледяной гигант', color:'#7ec8e3', civ:false, rate:600,  desc:'Источник комет.'},
  gasGiant:   {name:'Газовый гигант', color:'#d4a76a', civ:false, rate:800,  desc:'Гравитационный щит системы.'},
  lava:       {name:'Лава-планета',   color:'#ff4a22', civ:false, rate:1200, desc:'Раскалённый мир. Максимальный доход.'},
};

const S = {
  stage: 'cloud',
  dust: 0, dustTotal: 0,
  starType: null, systemType: null,
  planets: [],
  systems: 1,
  missions: [],
  flights: [],
  cooldowns: { expedition: 0, comet: 0 },
  lastTick: Date.now(),
  eventTimer: 0,
  choiceTimer: 0,
  collisionTimer: 0,
  gammaDebuff: 0,
  civLevel: 0,
  civClickBoost: 0,
  vis: { collapse: 0 },
  particles: [],
};

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const VIEW_COS = 0.5;
function hash(n){const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s);}
const UNITS = ['','К','М','Б','Т','Кв','Кт','Сх','Сп','Ок','Нн','Дц'];
function fmt(n){
  if (n < 1000) return Math.floor(n).toString();
  let i = 0; while (n >= 1000 && i < UNITS.length - 1){n /= 1000; i++;}
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + UNITS[i];
}
function fmtTime(sec){
  if (sec < 0) sec = 0;
  if (sec < 60) return Math.floor(sec) + 'с';
  if (sec < 3600) return Math.floor(sec/60) + ':' +
    String(Math.floor(sec%60)).padStart(2,'0');
  return Math.floor(sec/3600) + 'ч ' + Math.floor((sec%3600)/60) + 'м';
}
const toastsEl = $('toasts');
function toast(title, sub, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.innerHTML = '<b>' + title + '</b>' + (sub || '');
  toastsEl.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ═══════════ ECONOMY ═══════════
function planetRate(){
  return S.planets.reduce((s,p) => {
    if (p.forming) return s;
    return s + PLANET_TYPES[p.type].rate;
  }, 0);
}
function starMult(){ return S.starType ? STAR_TYPES[S.starType].rateMult : 1; }
function systemTypeMult(){
  return S.systemType ? SYSTEM_TYPES[S.systemType].rateMult : 1;
}
function systemMult(){ return 1 + Math.max(0, S.systems - 1) * 0.5; }
function gammaMult(){ return Date.now() < S.gammaDebuff ? 0.4 : 1; }
function dustPerSec(){
  const st = STAGES[S.stage];
  if (!st) return 0;
  return (st.baseRate + planetRate()) * starMult() * systemTypeMult() *
         systemMult() * gammaMult();
}
function clickGain(){
  const st = STAGES[S.stage];
  if (!st) return 0;
  return st.clickRate * starMult() * systemTypeMult() * systemMult() * gammaMult();
}
function planetCost(n){ return Math.floor(500000 * Math.pow(2.2, n)); }
function systemCost(n){ return Math.floor(5e9 * Math.pow(2.5, n)); }

function expeditionMaxCapacity(){
  return 5000 + S.systems * 2000 + S.planets.length * 1000;
}
function cometMaxCapacity(){
  const ice = iceGiantCount();
  return 3000 + S.systems * 1500 + ice * 2000;
}
function expeditionActive(){
  return S.missions.some(m => m.type === 'expedition');
}

function currentGoal(){
  const st = STAGES[S.stage];
  if (S.stage === 'cloud' || S.stage === 'condense' ||
      S.stage === 'protostar' || S.stage === 'firstPlanet') return st.goal;
  if (S.stage === 'system'){
    if (S.planets.length >= 8) return null;
    return planetCost(S.planets.length);
  }
  if (S.stage === 'galaxy') return systemCost(S.systems - 1);
  return null;
}

// ═══════════ EVOLUTION ═══════════
function checkEvolution(){
  if ($('modal').classList.contains('show')) return;
  if (S.stage === 'protostar' && S.dust >= STAGES.protostar.goal){
    S.stage = 'firstPlanet';
    toast('Звезда зажглась', 'Диск остывает', 'good');
    return;
  }
  if (S.stage === 'system' && S.planets.length >= 8){
    openEvolution(); return;
  }
  const goal = currentGoal();
  if (goal === null) return;
  if (S.dust >= goal) openEvolution();
}

  const stage = S.stage;
  if (stage === 'cloud'){
    showModal('Сжатие облака', 'Облако готово к гравитационному коллапсу.', [

    showModal('Первая планета', 'Выбери тип первой планеты системы.',
      Object.entries(PLANET_TYPES).map(([k,pt]) => ({
        id:k, name:pt.name, desc:pt.desc,
        stats:`Доход +${pt.rate}/с · ${pt.civ ? 'Жизнь возможна' : 'Без жизни'}`,
        color:pt.color, icon:'🪐',
        run: () => {
          S.planets.push({
            type:k, angle: hash(0)*TAU, speed:0.15,
            baseOrbitR:100, orbitR:100, seed: Math.random()*1e6,
            forming:false, formUntil:0,
          });
          S.stage = 'system';
          toast(pt.name + ' сформирована', 'Орбита 1', 'good');
        }
      }))
    );
  } else if (stage === 'system'){
    if (S.planets.length >= 8){
      showModal('Система сформирована',
        'Все 8 планет на орбитах. Пора расширяться в галактику.',
        [{ id:'expand', name:'Основать новую систему',
           desc:'Отправь экспедицию к соседней звезде.',
           stats:'+50% к глобальному доходу',
           color:'#6b4de6', icon:'🌌',
           run: () => {
             S.stage = 'galaxy'; S.systems = 2;
             toast('Первая колония', 'Галактика расширяется', 'good');
           }}]
      );
    } else {
      const cost = planetCost(S.planets.length);
      showModal('Новая планета',
        `Выбери тип планеты №${S.planets.length + 1}. Стоимость: ${fmt(cost)} пыли.`,
        Object.entries(PLANET_TYPES).map(([k,pt]) => ({
          id:k, name:pt.name, desc:pt.desc,
          stats:`+${pt.rate}/с · Стоимость ${fmt(cost)}`,
          color:pt.color, icon:'🪐',
          run: () => {
            if (S.dust < cost){ toast('Недостаточно пыли','','bad'); return; }
            S.dust -= cost;
            S.planets.push({
              type:k,
              angle: hash(S.planets.length * 7.3) * TAU,
              speed: 0.15 / Math.sqrt(S.planets.length + 1),
              baseOrbitR: 100 + S.planets.length * 30,
              orbitR: 100 + S.planets.length * 30,

          }
        }))
      );
    }
  } else if (stage === 'galaxy'){
    const cost = systemCost(S.systems - 1);
    showModal('Новая система',
      `Строительство системы №${S.systems + 1}. Стоимость: ${fmt(cost)} пыли.`,
      [{ id:'build', name:'Основать систему',
         desc:'Отправь корабль-ковчег к соседней звезде.',
         stats:`+50% к доходу · Стоимость ${fmt(cost)}`,
         color:'#8b5cf6', icon:'🌌',

           if (S.dust < cost){ toast('Недостаточно пыли','','bad'); return; }
           S.dust -= cost; S.systems++;
           toast('Система основана', 'Всего: ' + S.systems, 'good');
         }}]
    );
  }
}

// ═══════════ CIV ═══════════
function civPlanetCount(){
  if (!S.starType || !STAR_TYPES[S.starType].civ) return 0;
  return S.planets.filter(p => PLANET_TYPES[p.type].civ && !p.forming).length;
}
function hasCivPlanet(){ return civPlanetCount() > 0; }
function iceGiantCount(){
  return S.planets.filter(p => p.type === 'iceGiant' && !p.forming).length;
}

function tickCiv(dt){
  const c = civPlanetCount();
  if (c === 0){ S.civClickBoost *= 0.9; return; }
  const sysType = S.systemType || 'single';
  const passiveMult = SYSTEM_TYPES[sysType].civPassiveMult;
  const base = CFG.civGrowthPerPlanet * c * passiveMult;
  S.civLevel += base * dt;
  // Boost from clicks decays
  S.civClickBoost *= Math.pow(0.5, dt / 3); // half-life ~3 sec
}

function registerCivClick(){
  if (!hasCivPlanet()) return;
  const sysType = S.systemType || 'single';
  const clickMult = SYSTEM_TYPES[sysType].civClickMult;
  const boost = 0.02 * clickMult;
  S.civLevel += boost;
  S.civClickBoost = Math.min(1, S.civClickBoost + 0.15);
}

// ═══════════ COLLISIONS + ORBITAL DRIFT ═══════════
function tickOrbitalDrift(dt){
  // Each planet has slowly drifting orbit radius (visual + collision)
  for (const p of S.planets){
    p.orbitR = p.baseOrbitR * (1 + 0.12 * Math.sin(
      Date.now() * 0.00002 + p.seed * 0.001));
  }
}

function tickCollisions(dt){
  if (!S.systemType) return;
  const st = SYSTEM_TYPES[S.systemType];
  if (!st.collisionPerPlanet) return;
  const activePlanets = S.planets.filter(p => !p.forming);
  if (activePlanets.length < 3) return;
  S.collisionTimer += dt * 1000;
  if (S.collisionTimer < CFG.collisionInterval) return;
  S.collisionTimer = 0;
  const chance = st.collisionPerPlanet * activePlanets.length;
  if (Math.random() > chance) return;

  // Pick two nearby planets by orbit
  const sorted = [...activePlanets].sort((a,b) => a.orbitR - b.orbitR);
  let chosen = null;
  for (let i = 0; i < sorted.length - 1; i++){
    const gap = Math.abs(sorted[i+1].orbitR - sorted[i].orbitR);
    if (gap < 40){ chosen = [sorted[i], sorted[i+1]]; break; }
  }
  if (!chosen) return;
  const [a, b] = chosen;
  const idxA = S.planets.indexOf(a);
  const idxB = S.planets.indexOf(b);
  const aPt = PLANET_TYPES[a.type];
  const bPt = PLANET_TYPES[b.type];

  if (Math.random() < 0.5){
    // Destroy
    const refund = Math.floor((aPt.rate + bPt.rate) * 600);
    S.dust += refund; S.dustTotal += refund;
    if (idxA >= 0) S.planets.splice(idxA, 1);
    if (idxB >= 0) S.planets.splice(S.planets.indexOf(b), 1);
    showEventBanner('danger', '💥 Столкновение',
      aPt.name + ' и ' + bPt.name + ' разрушены. +' + fmt(refund) + ' пыли');
    toast('Столкновение!', '+' + fmt(refund), 'bad');
  } else {
    // Merge into forming planet
    const combinedRate = (aPt.rate + bPt.rate) * 0.9;
    const allTypes = Object.keys(PLANET_TYPES);
    let bestType = allTypes[0], bestDiff = Infinity;
    for (const t of allTypes){
      const diff = Math.abs(PLANET_TYPES[t].rate - combinedRate);
      if (diff < bestDiff){ bestDiff = diff; bestType = t; }
    }
    if (idxA >= 0) S.planets.splice(idxA, 1);
    if (idxB >= 0) S.planets.splice(S.planets.indexOf(b), 1);
    S.planets.push({
      type: bestType,
      angle: hash(S.planets.length * 7.3) * TAU,
      speed: 0.15 / Math.sqrt(S.planets.length + 1),
      baseOrbitR: 100 + S.planets.length * 30,
      orbitR: 100 + S.planets.length * 30,
      seed: Math.random() * 1e6,
      forming: true,
      formUntil: Date.now() + CFG.formationDuration,
    });
    showEventBanner('info', '🪐 Слияние',
      aPt.name + ' + ' + bPt.name + ' → формируется ' + PLANET_TYPES[bestType].name);
    toast('Формирование планеты',
      fmtTime(CFG.formationDuration/1000) + ' до готовности', 'info');
  }
}

// ═══════════ FLIGHTS (визуал кораблей) ═══════════
function addFlight(type, originPlanet, color, icon){
  const angle = Math.random() * TAU;
  S.flights.push({
    type,
    originIdx: originPlanet ? S.planets.indexOf(originPlanet) : -1,
    color, icon,
    angle,
    startAt: Date.now(),
    outboundDuration: 2000,
    inboundDuration: 2000,
    phase: 'outbound',
  });
}

function drawFlights(t){
  const now = Date.now();
  for (let i = S.flights.length - 1; i >= 0; i--){
    const f = S.flights[i];
    const elapsed = now - f.startAt;
    let progress, distance, alpha;
    if (f.phase === 'outbound'){
      progress = Math.min(1, elapsed / f.outboundDuration);
      distance = 80 + progress * 500;
      alpha = 1 - Math.max(0, (progress - 0.85) / 0.15);
      if (progress >= 1){ S.flights.splice(i, 1); continue; }
    } else {
      progress = Math.min(1, elapsed / f.inboundDuration);
      distance = 580 - progress * 500;
      alpha = Math.min(1, progress / 0.15);
      if (progress >= 1){ S.flights.splice(i, 1); continue; }
    }
    
    // Origin position (from planet if exists, else center)
    let ox = cx, oy = cy;
    if (f.originIdx >= 0 && S.planets[f.originIdx]){
      const p = S.planets[f.originIdx];
      const a = p.angle + t * p.speed;
      ox = cx + Math.cos(a) * p.orbitR;
      oy = cy + Math.sin(a) * p.orbitR * VIEW_COS;
    }
    
    const fx = cx + Math.cos(f.angle) * distance;
    const fy = cy + Math.sin(f.angle) * distance * VIEW_COS;
    
    // Trail
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const trailLen = 6;
    for (let k = 0; k < trailLen; k++){
      const seg = k / trailLen;
      const tx = fx - Math.cos(f.angle) * (15 + seg * 30);
      const ty = fy - Math.sin(f.angle) * (15 + seg * 30) * VIEW_COS;
      ctx.globalAlpha = (1 - seg) * 0.5 * alpha;
      const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, 6);
      g.addColorStop(0, f.color);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(tx, ty, 6, 0, TAU); ctx.fill();
    }
    // Ship
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.icon, fx, fy);
    ctx.restore();
  }
}

// ═══════════ EXPEDITION ═══════════
function openExpeditionChoice(){
  if (Date.now() < S.cooldowns.expedition) return;
  if (expeditionActive()){ toast('Экспедиция уже в пути','Дождись возврата','bad'); return; }
  if (!hasCivPlanet()) return;
  const maxCap = expeditionMaxCapacity();
  const minInvest = Math.max(500, Math.floor(maxCap * 0.05));
  const maxInvest = Math.min(Math.floor(S.dust), maxCap);
  if (maxInvest < minInvest){
    toast('Слишком мало пыли', 'Или система слишком мала', 'bad'); return;
  }
  const initial = Math.floor((minInvest + maxInvest) / 2);
  const baseFlight = CFG.expeditionFlightBase;
  const baseReward = 400000 * (1 + S.planets.length * 0.4) * S.systems;

  const html = `
    <div class="modal-title">Экспедиция</div>
    <div class="modal-sub">Малая — быстрая, но рискованная. Большая — надёжнее и прибыльнее, но долгая.</div>
    <div class="slider-wrap">
      <div class="slider-label">Вложено пыли</div>
      <div class="slider-value" id="invVal">0</div>
      <input type="range" id="invSlider" min="${minInvest}" max="${maxInvest}" value="${initial}" step="1">
      <div class="limit-hint">Максимум: <b>${fmt(maxInvest)}</b> · Предел: <b>${fmt(maxCap)}</b></div>
      <div class="stats-row">
        <div class="stats-cell">Полёт<b id="fTime">—</b></div>
        <div class="stats-cell">Награда<b id="fRew">—</b></div>
        <div class="stats-cell">Риск<b id="fRisk">—</b></div>
        <div class="stats-cell">Колония<b id="fCol">—</b></div>
      </div>
    </div>
    <button class="confirm-btn" id="confirmLaunch">Запустить</button>
    <button class="cancel-btn" id="cancelLaunch">Отмена</button>`;
  $('modalCard').innerHTML = html;
  $('modal').classList.add('show');

  const slider = $('invSlider');
  function update(){
    const invest = parseInt(slider.value);
    const ratio = (invest - minInvest) / Math.max(1, maxInvest - minInvest);
    const flight = Math.floor(baseFlight * (0.3 + ratio * 1.2));
    const reward = Math.floor(baseReward * (0.5 + ratio * 4));
    const fail = 0.55 - ratio * 0.50;
    const col = 0.005 + ratio * 0.045;
    $('invVal').textContent = fmt(invest);
    $('fTime').textContent = fmtTime(flight);
    $('fRew').textContent = '~' + fmt(reward);
    $('fRisk').textContent = Math.round(fail * 100) + '%';
    $('fCol').textContent = (col * 100).toFixed(1) + '%';
  }
  slider.addEventListener('input', update);
  update();

  $('confirmLaunch').onclick = () => {
    const invest = parseInt(slider.value);
    $('modal').classList.remove('show');
    launchExpeditionWith(invest, minInvest, maxInvest);
  };
  $('cancelLaunch').onclick = () => $('modal').classList.remove('show');
}

function launchExpeditionWith(invest, minInvest, maxInvest){
  if (S.dust < invest){ toast('Недостаточно пыли','','bad'); return; }
  if (expeditionActive()){ toast('Уже в пути','','bad'); return; }
  S.dust -= invest;
  S.cooldowns.expedition = Date.now() + CFG.expeditionCooldown;
  const ratio = (invest - minInvest) / Math.max(1, maxInvest - minInvest);
  const baseFlight = CFG.expeditionFlightBase;
  const baseReward = 400000 * (1 + S.planets.length * 0.4) * S.systems;
  const flight = Math.floor(baseFlight * (0.3 + ratio * 1.2) * (0.85 + Math.random() * 0.3));
  const reward = Math.floor(baseReward * (0.5 + ratio * 4));
  const fail = 0.55 - ratio * 0.50;
  const colChance = 0.005 + ratio * 0.045;
  // Pick origin planet (first civ planet)
  const civPlanet = S.planets.find(p => PLANET_TYPES[p.type].civ && !p.forming);
  S.missions.push({
    id: Math.random().toString(36).slice(2),
    type:'expedition',
    startAt: Date.now(),
    duration: flight * 1000,
    reward,
    fail: Math.random() < fail,
    colChance,
    originSeed: civPlanet ? civPlanet.seed : 0,
  });
  addFlight('expedition', civPlanet, '#5ee0a0', '🚀');
  toast('Экспедиция запущена', 'Возврат через ' + fmtTime(flight), 'info');
}

    </div>
    <button class="confirm-btn" id="confirmLaunch">Запустить</button>
    <button class="cancel-btn" id="cancelLaunch">Отмена</button>`;
  $('modalCard').innerHTML = html;
  $('modal').classList.add('show');

  const slider = $('invSlider');
  function update(){
    const invest = parseInt(slider.value);
    const ratio = (invest - minInvest) / Math.max(1, maxInvest - minInvest);
    const flight = Math.floor(baseFlight * (0.4 + ratio * 1.0));
    const reward = Math.floor(baseReward * (0.5 + ratio * 4));
    const fail = 0.45 - ratio * 0.40;
    $('invVal').textContent = fmt(invest);
    $('fTime').textContent = fmtTime(flight);
    $('fRew').textContent = '~' + fmt(reward);
    $('fRisk').textContent = Math.round(fail * 100) + '%';
  }
  slider.addEventListener('input', update);
  update();

  $('confirmLaunch').onclick = () => {
    const invest = parseInt(slider.value);
    $('modal').classList.remove('show');
    launchCometWith(invest, minInvest, maxInvest);
  };
  $('cancelLaunch').onclick = () => $('modal').classList.remove('show');
}

function launchCometWith(invest, minInvest, maxInvest){
  if (S.dust < invest){ toast('Недостаточно пыли','','bad'); return; }
  S.dust -= invest;
  S.cooldowns.comet = Date.now() + CFG.cometCooldown;
  const ice = iceGiantCount();
  const ratio = (invest - minInvest) / Math.max(1, maxInvest - minInvest);
  const baseFlight = CFG.cometFlightBase;
  const baseReward = 200000 * (1 + S.planets.length * 0.3) * ice * S.systems;
  const flight = Math.floor(baseFlight * (0.4 + ratio * 1.0) * (0.85 + Math.random() * 0.3));
  const reward = Math.floor(baseReward * (0.5 + ratio * 4));
  const fail = 0.45 - ratio * 0.40;
  const icePlanet = S.planets.find(p => p.type === 'iceGiant' && !p.forming);
  S.missions.push({
    id: Math.random().toString(36).slice(2),
    type:'comet',
    startAt: Date.now(),
    duration: flight * 1000,
    reward,
    fail: Math.random() < fail,
    originSeed: icePlanet ? icePlanet.seed : 0,
  });
  addFlight('comet', icePlanet, '#7ec8e3', '☄️');
  toast('Комета запущена', 'Возврат через ' + fmtTime(flight), 'info');
}

// ═══════════ MISSIONS ═══════════
function tickMissions(){
  const now = Date.now();
  for (let i = S.missions.length - 1; i >= 0; i--){
    const m = S.missions[i];
    if (now - m.startAt >= m.duration){
      // Add inbound flight
      const originPlanet = S.planets.find(p => p.seed === m.originSeed);
      const icon = m.type === 'comet' ? '☄️' : '🚀';
      const color = m.type === 'comet' ? '#7ec8e3' : '#5ee0a0';
      addFlight(m.type, originPlanet, color, icon);
      
      if (m.fail){
        toast(m.type === 'comet' ? 'Комета потеряна' : 'Корабль не вернулся',
              'Экспедиция провалилась', 'bad');
      } else {
        S.dust += m.reward; S.dustTotal += m.reward;
        toast(m.type === 'comet' ? 'Комета вернулась' : 'Экспедиция вернулась',
              '+' + fmt(m.reward) + ' пыли', 'good');
        if (m.type === 'expedition' && m.colChance && Math.random() < m.colChance){
          setTimeout(offerColony, 900);
        }
      }
      S.missions.splice(i, 1);
    }
  }
}

function colonyCivCost(){ return Math.ceil(20 * Math.pow(1.8, S.systems - 1)); }
function colonyDustCost(){ return Math.floor(2e9 * Math.pow(2.5, S.systems - 1)); }

function offerColony(){
  if ($('modal').classList.contains('show')) return;
  const dustCost = colonyDustCost();
  const civCost = colonyCivCost();
  const canAffordDust = S.dust >= dustCost;
  const canAffordCiv = S.civLevel >= civCost;
  const canAfford = canAffordDust && canAffordCiv;
  const currentIncome = dustPerSec();
  const newIncome = currentIncome * 1.5;
  const payback = canAfford ? Math.floor(dustCost / Math.max(1, newIncome - currentIncome)) : 0;
  const dustStatus = canAffordDust
    ? '<span style="color:#5ee0a0">✓</span>'
    : '<span style="color:#ff5e5e">−' + fmt(dustCost - S.dust) + '</span>';
  const civStatus = canAffordCiv
    ? '<span style="color:#5ee0a0">✓</span>'
    : '<span style="color:#ff5e5e">−' + (civCost - Math.floor(S.civLevel)) + ' ур.</span>';
  showModal('Обнаружена система',
    'Экспедиция принесла координаты пригодной для жизни системы. Освоить её?',
    [
      { id:'colonize', name:'Освоить систему',
        desc: canAfford ? '+50% к глобальному доходу' : 'Не хватает ресурсов',
        stats: `Пыль: <b>${fmt(dustCost)}</b> ${dustStatus}<br>
                Цив: <b>${civCost}</b> ур. ${civStatus}<br>
                Окупится за <b>${fmtTime(payback)}</b>`,
        color:'#2eaa77', icon:'🌍',
        disabled: !canAfford,
        run: () => {
          S.dust -= dustCost;
          S.civLevel -= civCost;
          S.systems++;
          toast('Колония основана', 'Всего систем: ' + S.systems, 'good');
        }
      },
      { id:'skip', name:'Отказаться',
        desc: 'Сохранить ресурсы', stats:'Ничего не произойдёт',
        color:'#6b6b6b', icon:'✕',
        run: () => toast('Отказ', 'Ресурсы сохранены', 'info')
      }
    ]
  );
}

// ═══════════ PARTICLES ═══════════
function initParticles(){
  S.particles = [];
  for (let i = 0; i < 380; i++){
    const u = hash(i * 1.1);
    const r0 = 20 + Math.pow(u, 0.7) * 240;
    const zSign = hash(i * 3.3) > 0.5 ? 1 : -1;
    S.particles.push({
      r0, a0: hash(i * 2.2) * TAU,
      z0: zSign * Math.pow(hash(i * 4.4), 0.6) * 200,
      baseSize: 0.4 + Math.pow(hash(i * 5.5), 3) * 2.2,
      bright: 0.3 + hash(i * 6.6) * 0.7,
      baseHue: hash(i * 7.7) < 0.72 ? 215 + hash(i * 8.8) * 50 : 15 + hash(i * 9.9) * 35,
      spin: (0.08 + hash(i * 10.1) * 0.12) / Math.sqrt(0.5 + r0 / 100),
      tw: hash(i * 11.2) * TAU,
    });
  }
}

const canvas = $('sky'), ctx = canvas.getContext('2d');
let W, H, cx, cy, dpr;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H * 0.34;
}
window.addEventListener('resize', resize);

const bgStars = [];
for (let i = 0; i < 200; i++) bgStars.push({
  x: Math.random(), y: Math.random(), r: 0.2 + Math.random() * 1.1,
  a: 0.15 + Math.random() * 0.55, tw: Math.random() * TAU,
  hue: 200 + Math.random() * 100,
});

function drawBackground(t){
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.9);
  bg.addColorStop(0, '#0a0620'); bg.addColorStop(1, '#02010a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (S.stage === 'galaxy' && S.systems >= 3){
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 4; i++){
      const rot = t * 0.05 + i * Math.PI / 2;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(1, 0.35);
      const g = ctx.createRadialGradient(0, 0, 30, 0, 0, W * 0.75);
      g.addColorStop(0, 'rgba(180,140,255,0)');
      g.addColorStop(0.5, 'rgba(150,100,240,0.10)');
      g.addColorStop(1, 'rgba(100,60,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, W * 0.75, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (const s of bgStars){
    const tw = 0.5 + 0.5 * Math.sin(t * 1.4 + s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = 'hsl(' + s.hue + ',35%,90%)';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawCloud(t){
  const collapse = S.vis.collapse;
  if (collapse > 0.95) return;
  const alpha = (1 - collapse) * Math.min(1, 0.35 + S.dustTotal / 2500);
  if (alpha < 0.02) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of S.particles){
    const theta = p.a0 + t * p.spin * (0.3 + collapse * 0.7);
    const r = p.r0 * (1 - collapse * 0.42);
    const z = p.z0 * (1 - collapse * 0.94);
    const x = cx + r * Math.cos(theta);
    const y = cy + r * Math.sin(theta) * VIEW_COS * (1 - collapse * 0.5) +
              z * 0.87 * (1 - collapse * 0.7);
    const tw = 0.65 + 0.35 * Math.sin(t * 1.8 + p.tw);
    ctx.globalAlpha = Math.min(1, p.bright * tw * alpha);
    ctx.fillStyle = 'hsl(' + p.baseHue + ',70%,65%)';
    ctx.beginPath(); ctx.arc(x, y, p.baseSize, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function drawOneStar(sx, sy, R, t, seed){
  const st = STAR_TYPES[S.starType];
  const hue = st.color, sat = st.sat, light = st.light;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let layer = 0; layer < 3; layer++){
    const size = R * (5 + layer * 2.5);
    const g = ctx.createRadialGradient(sx, sy, R * 0.3, sx, sy, size);
    g.addColorStop(0, 'hsla(' + hue + ',' + sat + '%,' + (light+15) + '%,0.5)');
    g.addColorStop(0.2, 'hsla(' + hue + ',' + sat + '%,' + light + '%,0.3)');
    g.addColorStop(0.6, 'hsla(' + (hue-10) + ',' + (sat-10) + '%,' + (light-20) + '%,0.09)');
    g.addColorStop(1, 'hsla(' + (hue-20) + ',' + (sat-20) + '%,' + (light-30) + '%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, size, 0, TAU); ctx.fill();
  }
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 0.3 + seed);
  for (let i = 0; i < 5; i++){
    const angle = (i / 5) * TAU;
    const flare = Math.sin(t * 1.2 + i + seed) * 0.3 + 0.7;
    const dist = R * (1.4 + flare * 0.6);
    const fx = Math.cos(angle) * dist, fy = Math.sin(angle) * dist;
    const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, R * 0.8);
    fg.addColorStop(0, 'hsla(' + hue + ',' + sat + '%,' + (light+20) + '%,' + (0.5*flare) + ')');
    fg.addColorStop(1, 'hsla(' + hue + ',' + sat + '%,' + light + '%,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(fx, fy, R * 0.8, 0, TAU); ctx.fill();
  }
  ctx.restore();
  const pulse = 1 + 0.06 * Math.sin(t * 2.4 + seed);
  const cg = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 2);
  cg.addColorStop(0, 'hsla(' + hue + ',100%,99%,1)');
  cg.addColorStop(0.3, 'hsla(' + hue + ',' + sat + '%,' + (light+15) + '%,0.9)');
  cg.addColorStop(1, 'hsla(' + hue + ',' + sat + '%,' + light + '%,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(sx, sy, R * pulse, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawStarSystem(t){
  if (!S.starType) return;
  const st = STAR_TYPES[S.starType];
  const sysType = S.systemType || 'single';
  const stars = SYSTEM_TYPES[sysType].stars;
  const R = 12 * st.size;
  if (stars === 1){
    drawOneStar(cx, cy, R, t, 0);
  } else if (stars === 2){
    const sep = R * 2.6, a = t * 0.22;
    drawOneStar(cx + Math.cos(a) * sep,
      cy + Math.sin(a) * sep * VIEW_COS * 0.6, R * 0.82, t, 1.7);
    drawOneStar(cx - Math.cos(a) * sep,
      cy - Math.sin(a) * sep * VIEW_COS * 0.6, R * 0.82, t, 3.4);
  } else {
    const sep = R * 2.2;
    for (let i = 0; i < 3; i++){
      const baseA = (i / 3) * TAU + t * 0.15;
      drawOneStar(cx + Math.cos(baseA) * sep,
        cy + Math.sin(baseA) * sep * VIEW_COS * 0.6, R * 0.68, t, i * 1.9);
    }
  }
}

function drawPlanets(t){
  if (S.planets.length === 0) return;
  const starHue = S.starType ? STAR_TYPES[S.starType].color : 260;
  // Orbits (drift)
  ctx.save();
  for (const p of S.planets){
    const forming = p.forming;
    ctx.strokeStyle = forming
      ? 'hsla(45,90%,60%,0.35)'
      : 'hsla(' + starHue + ',50%,60%,' + (p.forming ? 0.3 : 0.12) + ')';
    ctx.lineWidth = forming ? 1.5 : 1;
    if (forming) ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.ellipse(cx, cy, p.orbitR, p.orbitR * VIEW_COS, 0, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
  
  const sorted = S.planets.map(p => {
    const angle = p.angle + t * p.speed;
    const sinA = Math.sin(angle);
    const x = cx + Math.cos(angle) * p.orbitR;
    const y = cy + sinA * p.orbitR * VIEW_COS;
    return { p, x, y, depth: sinA };
  }).sort((a, b) => a.depth - b.depth);
  
  for (const { p, x, y, depth } of sorted){
    const pt = PLANET_TYPES[p.type];
    const behind = depth < 0;
    const scale = 1 + depth * 0.15;
    const size = 4 * scale;
    const alpha = behind ? 0.7 : 1;
    const r = parseInt(pt.color.slice(1, 3), 16);
    const g = parseInt(pt.color.slice(3, 5), 16);
    const b = parseInt(pt.color.slice(5, 7), 16);
    
    if (p.forming){
      // Forming planet: pulsing golden ring
      const now = Date.now();
      const remain = Math.max(0, (p.formUntil - now) / 1000);
      const total = CFG.formationDuration / 1000;
      const progress = 1 - remain / total;
      const pulse = 1 + 0.2 * Math.sin(t * 6);
      
      ctx.save();
      ctx.globalAlpha = 0.4 + progress * 0.5;
      const fg = ctx.createRadialGradient(x, y, 0, x, y, size * 4 * pulse);
      fg.addColorStop(0, 'rgba(255,220,150,0.9)');
      fg.addColorStop(0.5, 'rgba(255,180,80,0.4)');
      fg.addColorStop(1, 'rgba(255,150,50,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(x, y, size * 4 * pulse, 0, TAU); ctx.fill();
      
      // Progress ring
      ctx.strokeStyle = 'rgba(255,220,150,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, size * 2.5, -Math.PI/2, -Math.PI/2 + TAU * progress);
      ctx.stroke();
      ctx.restore();
      continue;
    }
    
    // Normal planet
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
    gg.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + (alpha*0.9) + ')');
    gg.addColorStop(0.5, 'rgba(' + r + ',' + g + ',' + b + ',' + (alpha*0.2) + ')');
    gg.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, size * 3, 0, TAU); ctx.fill();
    ctx.restore();
    
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(x, y, size, 0, TAU); ctx.fill();
    
    ctx.save(); ctx.globalCompositeOperation = 'multiply';
    const sa = Math.atan2(y - cy, x - cx) - Math.PI;
    const shx = x + Math.cos(sa) * size;
    const shy = y + Math.sin(sa) * size;
    const sg = ctx.createRadialGradient(shx, shy, 0, shx, shy, size * 2);
    sg.addColorStop(0, 'rgba(0,0,0,0.7)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(x, y, size, 0, TAU); ctx.fill();
    ctx.restore();
    
    // Civ glow
    if (PLANET_TYPES[p.type].civ && hasCivPlanet()){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const cv = ctx.createRadialGradient(x, y, 0, x, y, size * 2);
      cv.addColorStop(0, 'rgba(120,255,180,' + (0.3 + S.civClickBoost * 0.4) + ')');
      cv.addColorStop(1, 'rgba(120,255,180,0)');
      ctx.fillStyle = cv;
      ctx.beginPath(); ctx.arc(x, y, size * 2, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

// ═══════════ UI RENDER ═══════════
function renderMissions(){
  const el = $('missions');
  const now = Date.now();
  if (S.missions.length === 0){ el.innerHTML = ''; return; }
  el.innerHTML = S.missions.map(m => {
    const elapsed = (now - m.startAt) / m.duration;
    const left = Math.max(0, (m.duration - (now - m.startAt)) / 1000);
    const icon = m.type === 'comet' ? '☄️' : '🚀';
    const label = m.type === 'comet' ? 'Комета' : 'Экспедиция';
    return '<div class="mission">' +
      '<span class="mission-name">' + icon + ' ' + label + '</span>' +
      '<div class="mission-bar"><div style="width:' + (elapsed * 100) + '%"></div></div>' +
      '<span class="mission-time">' + fmtTime(left) + '</span>' +
    '</div>';
  }).join('');
}

function renderLaunchButtons(){
  const el = $('launchRow');
  const now = Date.now();
  const showExp = hasCivPlanet();
  const ice = iceGiantCount();
  const showComet = ice > 0;
  if (!showExp && !showComet){
    if (el.dataset.empty !== '1'){ el.innerHTML = ''; el.dataset.empty = '1'; }
    return;
  }
  el.dataset.empty = '0';
  const structureKey = (showExp ? 'E' : '') + (showComet ? 'C' : '');
  if (el.dataset.key !== structureKey){
    let html = '';
    if (showExp){
      html += '<button class="launch-btn exp" data-action="exp">' +
        '<span class="launch-icon">🚀</span>' +
        '<span class="btn-label">Экспедиция</span>' +
        '<span class="launch-sub"></span></button>';
    }
    if (showComet){
      html += '<button class="launch-btn cmt" data-action="cmt">' +
        '<span class="launch-icon">☄️</span>' +
        '<span class="btn-label">Комета</span>' +
        '<span class="launch-sub"></span></button>';
    }
    el.innerHTML = html;
    el.dataset.key = structureKey;
  }
  if (showExp){
    const btn = el.querySelector('[data-action="exp"]');
    if (btn){
      const inFlight = expeditionActive();
      const cd = Math.max(0, (S.cooldowns.expedition - now) / 1000);
      const ready = !inFlight && cd <= 0;
      btn.disabled = !ready;
      let sub = 'готова';
      if (inFlight) sub = 'в пути';
      else if (cd > 0) sub = fmtTime(cd);
      btn.querySelector('.btn-label').textContent = ready ? 'Экспедиция' : 'Недоступна';
      btn.querySelector('.launch-sub').textContent = sub;
    }
  }
  if (showComet){
    const btn = el.querySelector('[data-action="cmt"]');
    if (btn){
      const cd = Math.max(0, (S.cooldowns.comet - now) / 1000);
      const ready = cd <= 0;
      btn.disabled = !ready;
      btn.querySelector('.btn-label').textContent = ready ? 'Комета' : 'Перезарядка';
      btn.querySelector('.launch-sub').textContent = ready ? 'готова' : fmtTime(cd);
    }
  }
}

$('launchRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.launch-btn');
  if (!btn || btn.disabled) return;
  if (btn.dataset.action === 'exp') openExpeditionChoice();
  else if (btn.dataset.action === 'cmt') openCometChoice();
});

function renderUI(){
  const st = STAGES[S.stage];
  $('stageTag').textContent = st.tag;
  let scale = st.scale;
  if (S.systemType) scale += ' · ' + SYSTEM_TYPES[S.systemType].name;
  if (S.stage === 'galaxy') scale += ' · ' + S.systems + ' сист.';
  if (hasCivPlanet()) scale += ' · Цив ' + S.civLevel.toFixed(0);
  $('stageScale').textContent = scale;
  $('stageName').textContent = st.name;
  $('stageDesc').textContent = st.desc;
  $('goalLabel').textContent = st.goalLabel;
  const goal = currentGoal();
  let prog = 0, eta = '';
  if (S.stage === 'system' && S.planets.length >= 8){
    prog = 1; eta = 'Готово к расширению';
  } else if (goal){
    prog = Math.min(1, S.dust / goal);
    const rate = dustPerSec();
    if (rate > 0){
      const sec = Math.max(0, (goal - S.dust) / rate);
      eta = '≈ ' + fmtTime(sec) + ' до эволюции';
    }
  } else {
    prog = 1; eta = 'Готово';
  }
  $('goalBar').style.width = (prog * 100) + '%';
  $('goalPct').textContent = Math.floor(prog * 100) + '%';
  $('etaText').textContent = eta;
  $('dustVal').textContent = fmt(S.dust);
  $('dustRate').textContent = '+' + fmt(dustPerSec()) + ' / сек';
  const btn = $('evolveBtn');
  const canEvolve = (S.stage === 'system' && S.planets.length >= 8) ||
                    (goal !== null && S.dust >= goal);
  if (canEvolve && !$('modal').classList.contains('show')){
    btn.classList.add('show');
  } else {
    btn.classList.remove('show');
  }
}

// ═══════════ MAIN LOOP ═══════════
let last = performance.now(), lastSave = 0;
function loop(now){
  const dt = Math.min((now - last) / 1000, 0.5);
  last = now;
  const t = now / 1000;
  const gain = dustPerSec() * dt;
  S.dust += gain; S.dustTotal += gain;
  tickCiv(dt);
  tickOrbitalDrift(dt);
  tickCollisions(dt);
  
  // Check forming planets
  for (const p of S.planets){
    if (p.forming && Date.now() >= p.formUntil){
      p.forming = false;
      toast('Планета сформирована', PLANET_TYPES[p.type].name, 'good');
      showEventBanner('good', '🪐 Формирование завершено',
        PLANET_TYPES[p.type].name + ' вступила в строй');
    }
  }
  
  let target = 0;
  if (S.stage === 'condense') target = 0.3;
  if (S.stage === 'protostar') target = 0.7;
  if (S.starType) target = 1;
  S.vis.collapse += (target - S.vis.collapse) * Math.min(1, dt * 0.5);
  checkEvolution();
  tickMissions();
  tickPassiveEvents(dt);
  tickChoiceEvents(dt);
  drawBackground(t);
  if (!S.starType) drawCloud(t);
  drawStarSystem(t);
  drawPlanets(t);
  drawFlights(t);
  renderUI();
  renderMissions();
  renderLaunchButtons();
  if (now - lastSave > 4000){ save(); lastSave = now; }
  requestAnimationFrame(loop);
}

canvas.addEventListener('pointerdown', () => {
  const gain = clickGain();
  S.dust += gain; S.dustTotal += gain;
  registerCivClick();
});

$('evolveBtn').onclick = () => openEvolution();

function save(){
  try {
    localStorage.setItem('accretion_v12', JSON.stringify({
      stage: S.stage, dust: S.dust, dustTotal: S.dustTotal,
      starType: S.starType, systemType: S.systemType,
      planets: S.planets, systems: S.systems,
      cooldowns: S.cooldowns, missions: S.missions,
      gammaDebuff: S.gammaDebuff, civLevel: S.civLevel,
    }));
  } catch(e){}
}
function load(){
  try {
    const raw = localStorage.getItem('accretion_v12');
    if (!raw) return;
    const o = JSON.parse(raw);
    Object.assign(S, o);
    if (!S.cooldowns) S.cooldowns = { expedition: 0, comet: 0 };
    if (!S.missions) S.missions = [];
    if (!S.flights) S.flights = [];
    if (!S.systems) S.systems = 1;
    if (typeof S.civLevel !== 'number') S.civLevel = 0;
    // Ensure planets have baseOrbitR and forming
    for (const p of S.planets){
      if (!p.baseOrbitR) p.baseOrbitR = p.orbitR || 100;
      if (typeof p.forming !== 'boolean') p.forming = false;
    }
    S.vis.collapse = S.starType ? 1 : (S.stage === 'condense' ? 0.3 : 0);
  } catch(e){}
}

load();
initParticles();
resize();
requestAnimationFrame(loop);

$('turbo').onclick = () => {
  const goal = currentGoal();
  const amount = goal ? Math.max(10000, goal * 3) : 1e12;
  S.dust += amount; S.dustTotal += amount;
  toast('🚀 Turbo', '+' + fmt(amount) + ' пыли', 'info');
};

window.addEventListener('beforeunload', save);

let tagTaps = 0, tagTimer = 0;
$('stageTag').addEventListener('click', () => {
  tagTaps++;
  clearTimeout(tagTimer);
  tagTimer = setTimeout(() => { tagTaps = 0; }, 700);
  if (tagTaps >= 3){
    if (confirm('Сбросить весь прогресс?')){
      localStorage.removeItem('accretion_v12');
      location.reload();
    }
    tagTaps = 0;
  }
});
</script>
