<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ-панель Аккреция</title>
  <style>
    :root {
      --bg: #0a0620;
      --bg-2: #120a28;
      --panel: #171033;
      --panel-2: #1d1440;
      --line: rgba(139, 127, 212, 0.28);
      --line-soft: rgba(139, 127, 212, 0.14);
      --text: #e8e2ff;
      --muted: #a89ce0;
      --dim: #7c73a8;
      --accent: #8b5cf6;
      --accent-2: #6b4de6;
      --good: #4ade80;
      --warn: #ffb347;
      --bad: #ff5a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(900px 500px at 12% -10%, rgba(107, 77, 230, 0.24), transparent 60%),
        radial-gradient(700px 420px at 96% 0%, rgba(255, 90, 90, 0.10), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    h1 { font-size: 22px; margin: 0; color: #cbbcff; letter-spacing: .4px; }
    h2 { font-size: 17px; margin: 0; }
    a { color: #b9a8ff; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .small { font-size: 12px; }
    .mono { font-variant-numeric: tabular-nums; }

    button {
      padding: 8px 14px; border-radius: 9px; border: 1px solid transparent;
      background: var(--accent-2); color: #fff; font-weight: 600; cursor: pointer;
      transition: .15s; font-family: inherit; font-size: 13px;
    }
    button:hover { background: var(--accent); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--muted); }
    .btn-ghost:hover { background: rgba(139,127,212,.12); color: #fff; }
    .btn-danger { background: #c53030; }
    .btn-danger:hover { background: #e53e3e; }
    .btn-warning { background: #b7791f; color: #fff; }
    .btn-warning:hover { background: #d69e2e; }
    .btn-good { background: #16794b; }
    .btn-good:hover { background: #1c9c60; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }

    input, select {
      padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
      background: rgba(0,0,0,.45); color: #fff; font-family: inherit; font-size: 13px;
      min-width: 0;
    }
    input:focus, select:focus { outline: none; border-color: #b9a8ff; box-shadow: 0 0 0 2px rgba(139,92,246,.25); }
    input[type=number] { width: 100%; }
    select { width: 100%; }
    label.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    label.field > span { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }

    /* ── Шапка / авторизация ── */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .auth-box {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      padding: 30px; border-radius: 18px; border: 1px solid var(--accent-2);
      max-width: 340px; margin: 80px auto; text-align: center;
    }
    .auth-box input { width: 100%; margin-bottom: 14px; padding: 12px; font-size: 15px; }
    .auth-box button { width: 100%; }

    /* ── Карточки / сетки ── */
    .card {
      background: linear-gradient(180deg, rgba(29,20,64,.92), rgba(18,10,40,.92));
      border: 1px solid var(--line); border-radius: 16px; padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .card + .card { margin-top: 14px; }
    .card h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #b9a8ff; }
    .grid { display: grid; gap: 12px; }
    .grid.c2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid.c3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid.c4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .grid.c5 { grid-template-columns: repeat(5, minmax(0,1fr)); }
    @media (max-width: 900px) { .grid.c3, .grid.c4, .grid.c5 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 560px) { .grid.c2, .grid.c3, .grid.c4, .grid.c5 { grid-template-columns: 1fr; } }

    /* ── Таблица игроков ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); background: rgba(139,127,212,.08); }
    tbody tr:hover { background: rgba(139,127,212,.06); }
    .player-id { font-weight: 700; letter-spacing: .3px; }
    .player-sub { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
    .presence-badge { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
    .presence-online { background: rgba(70,200,120,.16); color: #6ee7a0; border: 1px solid rgba(70,200,120,.42); }
    .presence-offline { background: rgba(255,90,90,.14); color: #ff9b9b; border: 1px solid rgba(255,90,90,.4); }
    .presence-unknown { background: rgba(160,160,180,.14); color: #b8b4cc; border: 1px solid rgba(160,160,180,.32); }
    .empty { text-align: center; color: var(--muted); padding: 26px; }

    /* ── Выдвижная карточка игрока ── */
    .drawer {
      position: fixed; inset: 0; z-index: 100; display: none;
      background: rgba(2,1,10,.78); backdrop-filter: blur(6px);
      padding: 18px;
    }
    .drawer.open { display: flex; }
    .drawer-inner {
      margin: auto; width: min(1200px, 100%); max-height: calc(100vh - 36px);
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #1b1238, #0c0722);
      border: 1px solid var(--accent-2); border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,.75); overflow: hidden;
    }
    .drawer-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 16px 18px; border-bottom: 1px solid var(--line);
      background: rgba(139,127,212,.06); flex-wrap: wrap;
    }
    .drawer-title { display: flex; flex-direction: column; gap: 4px; }
    .drawer-title .name { font-size: 18px; font-weight: 700; }
    .drawer-title .meta { font-size: 12px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; }
    .drawer-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .tabs { flex: none; display: flex; gap: 6px; padding: 10px 14px 0; overflow-x: auto; overflow-y: hidden; border-bottom: 1px solid var(--line); }
    .tab {
      padding: 8px 12px; border-radius: 9px 9px 0 0; border: 1px solid transparent; border-bottom: none;
      background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .tab:hover { color: #fff; background: rgba(139,127,212,.08); }
    .tab.active { background: rgba(139,127,212,.16); color: #fff; border-color: var(--line); }
    .panes { padding: 16px 18px 24px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }

    /* ── Данные / чипы ── */
    .kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line-soft); font-size: 13px; }
    .kv:last-child { border-bottom: none; }
    .kv .k { color: var(--muted); }
    .kv .v { font-weight: 600; text-align: right; word-break: break-word; }
    .stat { background: rgba(0,0,0,.25); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; }
    .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .stat .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .stat .hint { font-size: 11px; color: var(--dim); margin-top: 2px; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(0,0,0,.3); font-size: 12px;
    }
    .chip.good { border-color: rgba(74,222,128,.45); background: rgba(74,222,128,.10); }
    .chip.bad { border-color: rgba(255,90,90,.45); background: rgba(255,90,90,.10); }
    .chip.warn { border-color: rgba(255,179,71,.45); background: rgba(255,179,71,.10); }
    .chip button { background: transparent; border: none; color: var(--muted); padding: 0 2px; font-size: 14px; line-height: 1; }
    .chip button:hover { color: var(--bad); background: transparent; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .row > * { flex: 1 1 140px; }
    .row > .fixed { flex: 0 0 auto; }
    .inline-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .note { font-size: 12px; color: var(--dim); line-height: 1.5; }
    .danger-zone { border-color: rgba(255,90,90,.35); }
    .danger-zone h3 { color: #ff9b9b; }
    .hint-badge { font-size: 11px; color: var(--dim); font-weight: 400; text-transform: none; letter-spacing: 0; }

    /* ── Тосты ── */
    #toasts { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
    .toast {
      background: #1c1440; border: 1px solid var(--line); border-left: 3px solid var(--good);
      border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 24px rgba(0,0,0,.5);
      animation: toast-in .18s ease-out;
    }
    .toast.error { border-left-color: var(--bad); }
    .toast .t { font-weight: 700; }
    .toast .s { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ── Модалка транзакций ── */
    .modal { position: fixed; inset: 0; z-index: 110; display: none; background: rgba(2,1,10,.8); backdrop-filter: blur(5px); padding: 20px; }
    .modal.open { display: flex; }
    .modal .modal-inner {
      margin: auto; width: min(960px, 100%); max-height: calc(100vh - 40px); overflow-y: auto;
      background: linear-gradient(180deg, #1a1030, #0a0620); border: 1px solid var(--accent-2);
      border-radius: 16px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.8);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .balance { font-size: 30px; font-weight: 800; color: #ffd54a; margin-bottom: 12px; }
    .progress-track { height: 8px; background: rgba(0,0,0,.4); border-radius: 999px; overflow: hidden; border: 1px solid var(--line-soft); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6b4de6, #b9a8ff); }
    .progress-fill.good { background: linear-gradient(90deg, #16794b, #4ade80); }
    .progress-fill.bad { background: linear-gradient(90deg, #9b2c2c, #ff5a5a); }
  </style>
</head>
<body>

  <!-- ═══ Вход ═══ -->
  <div id="authBlock" class="auth-box">
    <h1 style="margin-bottom:18px;">🛠 Вход в админку</h1>
    <input type="password" id="adminToken" placeholder="ADMIN_TOKEN" autocomplete="current-password">
    <button onclick="login()">Войти</button>
    <p class="note" style="margin:14px 0 0;">Токен хранится только в этом браузере.</p>
  </div>

  <!-- ═══ Список игроков ═══ -->
  <div id="mainBlock" style="display:none;">
    <div class="topbar">
      <div>
        <h1>🛠 Управление игроками</h1>
        <div class="note" id="playersSummary" style="margin-top:4px;">—</div>
      </div>
      <div class="topbar-actions">
        <input id="playerSearch" placeholder="Поиск по ID или нику" style="width:220px;" oninput="renderPlayers()">
        <button class="btn-ghost" onclick="openStarsModal()">⭐ Транзакции</button>
        <button class="btn-ghost" onclick="loadPlayers()">🔄 Обновить</button>
        <button class="btn-ghost" onclick="logout()">Выйти</button>
      </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <table id="playersTable">
        <thead>
          <tr>
            <th style="width:190px;">ID / сохранён</th>
            <th>Ник + статус</th>
            <th style="width:170px;">Фаза</th>
            <th style="width:150px;">Действие</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- ═══ Карточка игрока ═══ -->
  <div id="playerDrawer" class="drawer">
    <div class="drawer-inner">
      <div class="drawer-head">
        <div class="drawer-title">
          <div class="name" id="drawerName">Игрок</div>
          <div class="meta" id="drawerMeta"></div>
        </div>
        <div class="drawer-actions">
          <button class="btn-ghost btn-sm" onclick="refreshPlayer()">⟳ Обновить</button>
          <button class="btn-danger btn-sm" onclick="closePlayer()">✕ Закрыть</button>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="panes" id="panes"></div>
    </div>
  </div>

  <!-- ═══ Транзакции Telegram Stars ═══ -->
  <div id="starsModal" class="modal">
    <div class="modal-inner">
      <div class="modal-head">
        <h2>⭐ Telegram Stars</h2>
        <div style="display:flex; gap:8px;">
          <button class="btn-ghost btn-sm" onclick="loadStars()">⟳ Обновить</button>
          <button class="btn-danger btn-sm" onclick="closeStarsModal()">✕ Закрыть</button>
        </div>
      </div>
      <div class="note">Баланс бота</div>
      <div class="balance" id="starsBalance">—</div>
      <div class="note" style="margin-bottom:8px;">Последние 50 транзакций</div>
      <div style="overflow:auto;">
        <table id="starsTable">
          <thead><tr><th>Дата</th><th>ID пользователя</th><th>Сумма</th><th>Товар</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script>
    'use strict';

    const API_BASE = '';
    const TOKEN_KEY = 'accretion_admin_token';
    let token = localStorage.getItem(TOKEN_KEY) || '';
    let players = [];
    let cur = null;              // { id, data, presence, wallet, entitlements, purchases, version, savedAt }
    let activeTab = 'overview';
    let patchAvailable = true;   // false → падаем обратно на /set

    // ─── Справочники игры (не тянут клиент, чтобы админка работала отдельно) ───
    const STAGE_LABELS = {
      cloud:       { tag: 'Фаза I',   name: 'Молекулярное облако' },
      condense:    { tag: 'Фаза II',  name: 'Протопланетный диск' },
      protostar:   { tag: 'Фаза III', name: 'Протозвезда' },
      firstPlanet: { tag: 'Фаза IV',  name: 'Первая планета' },
      system:      { tag: 'Фаза V',   name: 'Формирование системы' },
      galaxy:      { tag: 'Фаза VI',  name: 'Межзвёздная экспансия' }
    };
    const PLANET_LABELS = {
      rocky: 'Скалистая', superEarth: 'Суперземля', iceGiant: 'Ледяной гигант',
      gasGiant: 'Газовый гигант', lava: 'Лавовая'
    };
    const GALAXY_FORMS = { spiral: 'Спиральная', elliptic: 'Эллиптическая', irregular: 'Неправильная' };
    const FLEET_SHIPS = {
      interceptor: 'Перехватчик', cruiser: 'Крейсер', dreadnought: 'Дредноут'
    };
    const INVASION_TIERS = { scout: 'Разведка', raid: 'Рейд', siege: 'Осада' };

    // Объекты Прайм-системы — копия js/prime.js: пишем в сейв настоящее имя,
    // иконку и бонусы, иначе игра покажет технический ключ и не даст множители.
    const PRIME_OBJECTS = {
      blackHole:  { name: 'Чёрная дыра',              icon: 'blackHole',  bonus: { dustMult: 0.25 },   absorbRadius: 150 },
      massiveBH:  { name: 'Массивная ЧД',             icon: 'massiveBH',  bonus: { dustMult: 0.50 },   absorbRadius: 200 },
      superBH:    { name: 'Сверхмассивная ЧД',        icon: 'superBH',    bonus: { dustMult: 1.00 },   absorbRadius: 260 },
      quasar:     { name: 'Квазар',                   icon: 'quasar',     bonus: { allMult: 0.30 },    absorbRadius: 130 },
      pulsar:     { name: 'Пульсар',                  icon: 'pulsar',     bonus: { energyMult: 0.50 }, absorbRadius: 100 },
      magnetar:   { name: 'Магнетар',                 icon: 'magnetar',   bonus: { planetHP: 2.0 },    absorbRadius: 120 },
      wormhole:   { name: 'Малая кротовая нора',      icon: 'wormhole',   bonus: { keepSystems: 0.2 }, absorbRadius: 90  },
      wormhole2:  { name: 'Кротовая нора',            icon: 'wormhole',   bonus: { keepSystems: 0.3 }, absorbRadius: 120 },
      wormhole3:  { name: 'Гигантская кротовая нора', icon: 'wormhole',   bonus: { keepSystems: 0.5 }, absorbRadius: 150 },
      darkMatter: { name: 'Тёмная материя',           icon: 'darkMatter', bonus: { incomePerHour: 0.005 }, absorbRadius: 0 },
      gravLens:   { name: 'Гравитационная линза',     icon: 'gravLens',   bonus: { autoClick: 2 },     absorbRadius: 0 },
      quarkVoid:  { name: 'Кварковый войд',           icon: 'quarkVoid',  bonus: { offlineMult: 2.0, capPenalty: 0.2 }, absorbRadius: 220 },
      primeBH:    { name: 'Первичная ЧД',             icon: 'primeBH',    bonus: { rareChance: 0.05 }, absorbRadius: 300 }
    };
    // Уровни есть только у чёрной дыры и кротовой норы.
    const PRIME_MAP = {
      blackHole: { lvl2: 'massiveBH', lvl3: 'superBH' },
      wormhole:  { lvl2: 'wormhole2', lvl3: 'wormhole3' }
    };
    const CHEST_LOOT = [
      { key: 'blackHole', weight: 20 }, { key: 'pulsar', weight: 20 }, { key: 'wormhole', weight: 20 },
      { key: 'quasar', weight: 10 }, { key: 'magnetar', weight: 10 }, { key: 'gravLens', weight: 10 },
      { key: 'massiveBH', weight: 4 }, { key: 'superBH', weight: 2 }, { key: 'darkMatter', weight: 2 },
      { key: 'quarkVoid', weight: 1 }, { key: 'primeBH', weight: 1 }
    ];
    const CHEST_UPGRADES = { blackHole: 'massiveBH', massiveBH: 'superBH', wormhole: 'wormhole2', wormhole2: 'wormhole3' };

    // Мировые события: daily-kind 'world' + все недельные. Прочие daily-события
    // (боссы, тапы, награды) не лежат в activeWorldEvents, их сюда не кладём.
    const WORLD_EVENTS = [
      { id: 'golden_hour',   title: 'Золотой час',          tier: 'daily' },
      { id: 'trade_boom',    title: 'Торговый бум',         tier: 'daily' },
      { id: 'solar_wind',    title: 'Солнечный ветер',      tier: 'daily' },
      { id: 'renaissance',   title: 'Ренессанс',            tier: 'daily' },
      { id: 'forge_fever',   title: 'Кузнечная лихорадка',  tier: 'daily' },
      { id: 'lucky_star',    title: 'Счастливая звезда',    tier: 'daily' },
      { id: 'neural_boost',  title: 'Нейроусиление',        tier: 'daily' },
      { id: 'dust_drought',  title: 'Пылевая засуха',       tier: 'daily' },
      { id: 'energy_leak',   title: 'Утечка энергии',       tier: 'daily' },
      { id: 'week_golden_age', title: 'День Золотого века', tier: 'weekly' },
      { id: 'week_comet',    title: 'День Комет',           tier: 'weekly' },
      { id: 'week_forge',    title: 'День Кузни',           tier: 'weekly' },
      { id: 'week_mind',     title: 'День Разума',          tier: 'weekly' },
      { id: 'week_storm',    title: 'День Штормов',         tier: 'weekly' },
      { id: 'week_void',     title: 'День Пустоты',         tier: 'weekly' },
      { id: 'week_wanderers',title: 'День Странников',      tier: 'weekly' },
      { id: 'week_harvest',  title: 'День Урожая',          tier: 'weekly' },
      { id: 'week_singularity', title: 'Полдня Сингулярности', tier: 'weekly' },
      { id: 'week_plague',   title: 'День Чумы',            tier: 'weekly' },
      { id: 'week_fortune',  title: 'День Фортуны',         tier: 'weekly' },
      { id: 'week_black_market', title: 'День Чёрного рынка', tier: 'weekly' },
      { id: 'week_taxes',    title: 'День Налогов',         tier: 'weekly' },
      { id: 'week_famine',   title: 'День Голода',          tier: 'weekly' },
      { id: 'week_darkness', title: 'День Тьмы',            tier: 'weekly' },
      { id: 'week_discord',  title: 'День Раздора',         tier: 'weekly' },
      { id: 'week_titanforge', title: 'День Титанов',       tier: 'weekly' },
      { id: 'week_echo',     title: 'День Эха',             tier: 'weekly' },
      { id: 'week_war',      title: 'День Войны',           tier: 'weekly' }
    ];
    const WORLD_EVENT_BY_ID = {};
    WORLD_EVENTS.forEach(function(ev) { WORLD_EVENT_BY_ID[ev.id] = ev; });

    const PRESENCE_REASONS = {
      hidden: 'окно скрыто', blur: 'без фокуса', idle: 'нет действий',
      'loop-stale': 'игра на паузе', 'no-report': 'нет отчёта', active: 'в игре'
    };

    // ─── Утилиты ────────────────────────────────────────────────
    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }
    function num(value, fallback) {
      const n = Number(value);
      return Number.isFinite(n) ? n : (fallback || 0);
    }
    function fmt(value) {
      const n = num(value);
      if (Math.abs(n) >= 1e15) return n.toExponential(2).replace('+', '');
      if (Math.abs(n) >= 1e12) return (n / 1e12).toFixed(2) + ' трлн';
      if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + ' млрд';
      if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + ' млн';
      return Math.round(n).toLocaleString('ru-RU');
    }
    function fmtDur(ms) {
      const total = Math.max(0, Math.floor(num(ms) / 1000));
      const d = Math.floor(total / 86400);
      const h = Math.floor((total % 86400) / 3600);
      const m = Math.floor((total % 3600) / 60);
      if (d > 0) return d + ' д ' + h + ' ч';
      if (h > 0) return h + ' ч ' + m + ' мин';
      if (m > 0) return m + ' мин';
      return total + ' с';
    }
    function fmtDate(ts) {
      const t = num(ts);
      return t > 0 ? new Date(t).toLocaleString('ru-RU') : '—';
    }
    function ago(ts) {
      const t = num(ts);
      if (t <= 0) return '—';
      const sec = Math.max(0, Math.round((Date.now() - t) / 1000));
      if (sec < 60) return sec + ' с назад';
      if (sec < 3600) return Math.round(sec / 60) + ' мин назад';
      if (sec < 86400) return Math.round(sec / 3600) + ' ч назад';
      return Math.round(sec / 86400) + ' дн назад';
    }
    function pct(part, total) {
      const p = num(total) > 0 ? (num(part) / num(total)) * 100 : 0;
      return Math.max(0, Math.min(100, p));
    }
    function stageLabel(stage) {
      const s = STAGE_LABELS[stage];
      return s ? s.tag + ': ' + s.name : (stage || '—');
    }
    function toast(title, sub, isError) {
      const box = document.getElementById('toasts');
      const el = document.createElement('div');
      el.className = 'toast' + (isError ? ' error' : '');
      el.innerHTML = '<div class="t">' + esc(title) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '');
      box.appendChild(el);
      setTimeout(function() { el.remove(); }, isError ? 6000 : 3000);
    }

    // ─── HTTP ───────────────────────────────────────────────────
    async function call(path, options) {
      const opts = Object.assign({}, options || {});
      const headers = Object.assign({ 'X-Admin-Token': token }, opts.headers || {});
      if (opts.body && typeof opts.body !== 'string') {
        opts.body = JSON.stringify(opts.body);
        headers['Content-Type'] = 'application/json';
      }
      opts.headers = headers;
      const res = await fetch(API_BASE + path, opts);
      if (res.status === 401) throw new Error('Неверный токен');
      return res;
    }
    async function readJson(res) {
      try { return await res.json(); } catch (e) { return {}; }
    }

    // ─── Авторизация и список ───────────────────────────────────
    function login() {
      const value = document.getElementById('adminToken').value.trim();
      if (!value) { toast('Введите токен', '', true); return; }
      token = value;
      localStorage.setItem(TOKEN_KEY, token);
      loadPlayers();
    }
    function logout() {
      token = '';
      localStorage.removeItem(TOKEN_KEY);
      players = [];
      cur = null;
      document.getElementById('mainBlock').style.display = 'none';
      document.getElementById('authBlock').style.display = 'block';
      document.getElementById('playerDrawer').classList.remove('open');
    }

    async function loadPlayers() {
      if (!token) return;
      try {
        const res = await call('/admin/api/players');
        const json = await readJson(res);
        if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
        players = Array.isArray(json.players) ? json.players : [];
        document.getElementById('authBlock').style.display = 'none';
        document.getElementById('mainBlock').style.display = 'block';
        renderPlayers();
      } catch (e) {
        toast('Ошибка загрузки', e.message, true);
        if (e.message === 'Неверный токен') {
          document.getElementById('authBlock').style.display = 'block';
          document.getElementById('mainBlock').style.display = 'none';
        }
      }
    }

    function presenceBadge(p) {
      if (!p || !p.status || p.status === 'unknown') {
        return '<span class="presence-badge presence-unknown" title="Статус ещё не приходил от клиента">⚪ нет данных</span>';
      }
      if (p.status === 'online') {
        return '<span class="presence-badge presence-online" title="Игрок сейчас в игре">🟢 онлайн</span>';
      }
      const reason = PRESENCE_REASONS[p.reason] || 'причина неизвестна';
      const idleMin = Math.floor(num(p.idleSec) / 60);
      const idle = idleMin > 0 ? ', ' + idleMin + ' мин' : '';
      const agoSec = num(p.at) > 0 ? Math.max(0, Math.round((Date.now() - p.at) / 1000)) : 0;
      const agoText = agoSec > 0 ? (agoSec >= 60 ? Math.round(agoSec / 60) + ' мин назад' : agoSec + ' с назад') : 'только что';
      return '<span class="presence-badge presence-offline" title="Последний отчёт: ' + esc(agoText) + '">🔴 оффлайн · ' + esc(reason) + esc(idle) + '</span>';
    }

    function renderPlayers() {
      const tbody = document.querySelector('#playersTable tbody');
      const filter = document.getElementById('playerSearch').value.trim().toLowerCase();
      const list = players.filter(function(p) {
        if (!filter) return true;
        return String(p.id).toLowerCase().includes(filter) || String(p.name || '').toLowerCase().includes(filter);
      });
      document.getElementById('playersSummary').textContent =
        'Всего игроков: ' + players.length + (filter ? ' · найдено: ' + list.length : '');

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">' + (players.length ? 'Никого не найдено' : 'Игроков пока нет') + '</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(function(p) {
        return '<tr>'
          + '<td><span class="player-id">' + esc(p.id) + '</span>'
          +     '<span class="player-sub">' + esc(ago(p.savedAt)) + '</span></td>'
          + '<td><strong>' + esc(p.name || 'Безымянный') + '</strong>' + presenceBadge(p.presence)
          +     '<span class="player-sub">' + esc(p.systemName || '—') + '</span></td>'
          + '<td>' + esc(stageLabel(p.stage)) + '</td>'
          + '<td><button class="btn-warning btn-sm" onclick="openPlayer(\'' + esc(String(p.id)) + '\')">Управлять</button></td>'
          + '</tr>';
      }).join('');
    }

    // ─── Карточка игрока: загрузка ───────────────────────────────
    async function openPlayer(id) {
      try {
        const res = await call('/admin/api/player/' + encodeURIComponent(id));
        const json = await readJson(res);
        if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
        cur = {
          id: String(json.id || id),
          data: (json.data && typeof json.data === 'object') ? json.data : {},
          presence: json.presence || null,
          wallet: json.wallet || null,
          entitlements: json.entitlements || null,
          purchases: Array.isArray(json.purchases) ? json.purchases : [],
          version: num(json.version),
          savedAt: num(json.savedAt)
        };
        activeTab = 'overview';
        document.getElementById('playerDrawer').classList.add('open');
        render();
      } catch (e) {
        toast('Не удалось открыть игрока', e.message, true);
      }
    }

    async function refreshPlayer() {
      if (!cur) return;
      try {
        const res = await call('/admin/api/player/' + encodeURIComponent(cur.id));
        const json = await readJson(res);
        if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
        cur.data = (json.data && typeof json.data === 'object') ? json.data : {};
        cur.presence = json.presence || null;
        cur.wallet = json.wallet || null;
        cur.entitlements = json.entitlements || null;
        cur.purchases = Array.isArray(json.purchases) ? json.purchases : [];
        cur.version = num(json.version);
        cur.savedAt = num(json.savedAt);
        render();
        toast('Данные обновлены');
      } catch (e) {
        toast('Ошибка обновления', e.message, true);
      }
    }

    function closePlayer() {
      document.getElementById('playerDrawer').classList.remove('open');
      cur = null;
      loadPlayers();
    }

    // ─── Сохранение полей ───────────────────────────────────────
    // Основной путь — батч-патч одним запросом (атомарно на сервере).
    // Если сервер старый и /patch ещё нет — построчно через /set.
    async function patch(fields, message) {
      if (!cur) return false;
      const payload = fields && typeof fields === 'object' ? fields : {};
      if (Object.keys(payload).length === 0) return true;

      try {
        if (patchAvailable) {
          const res = await call('/admin/api/player/' + encodeURIComponent(cur.id) + '/patch', {
            method: 'POST', body: { fields: payload }
          });
          if (res.status === 404 || res.status === 405) {
            patchAvailable = false;
          } else {
            const json = await readJson(res);
            if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
            if (json.wallet) cur.wallet = json.wallet;
            if (json.entitlements) cur.entitlements = json.entitlements;
            applyLocal(payload);
            if (message) toast('Сохранено', message);
            return true;
          }
        }
        if (!patchAvailable) {
          for (const key in payload) {
            const res = await call('/admin/api/player/' + encodeURIComponent(cur.id) + '/set', {
              method: 'POST', body: { field: key, value: payload[key] }
            });
            const json = await readJson(res);
            if (!res.ok || !json.ok) throw new Error(json.error || ('Не удалось записать ' + key));
          }
          applyLocal(payload);
          if (message) toast('Сохранено', message);
          return true;
        }
      } catch (e) {
        toast('Ошибка сохранения', e.message, true);
        return false;
      }
      return false;
    }

    function applyLocal(fields) {
      if (!cur) return;
      for (const key in fields) cur.data[key] = fields[key];
      cur.version = num(cur.version) + 1;
      cur.savedAt = Date.now();
      render();
    }

    // Обёртка для одного поля: перерисовываем после успеха.
    async function saveField(field, value, message) {
      const fields = {};
      fields[field] = value;
      await patch(fields, message || (field + ' = ' + (typeof value === 'object' ? 'обновлено' : value)));
    }

    function saveNested(field, subField, value, message) {
      const base = (cur && cur.data[field] && typeof cur.data[field] === 'object') ? Object.assign({}, cur.data[field]) : {};
      base[subField] = value;
      return saveField(field, base, message);
    }

    // ─── Деривация статистики из сейва ───────────────────────────
    function primeInfo(primeData) {
      const key = primeData && primeData.objectKey ? String(primeData.objectKey) : '';
      const def = PRIME_OBJECTS[key];
      let level = 1;
      for (const base in PRIME_MAP) {
        if (PRIME_MAP[base].lvl2 === key) level = 2;
        if (PRIME_MAP[base].lvl3 === key) level = 3;
      }
      return {
        objectKey: key,
        objectName: (primeData && primeData.objectName) || (def ? def.name : (key || '—')),
        level: level,
        bonus: (primeData && primeData.bonus) || (def ? def.bonus : null)
      };
    }

    function derive(d) {
      const now = Date.now();
      const activeIdx = num(d.activeSystemIdx);
      const planets = Array.isArray(d.planets) ? d.planets : [];
      const others = Array.isArray(d.otherSystems) ? d.otherSystems : [];
      // Сейв хранит активную систему в d.planets, а её же копию — в otherSystems[activeIdx].
      // Индекс 0 — родная система: null, пока она активна, иначе data родной системы.
      const homeSystem = (activeIdx === 0) ? {
        name: d.systemName || 'Родная', planets: planets,
        isPrime: !!d.primeSystem, primeData: d.primeSystem || null
      } : (others[0] || null);
      const activeSystem = {
        name: d.systemName || 'Активная', planets: planets,
        isPrime: !!d.primeSystem, primeData: d.primeSystem || null
      };
      const uniqueSystems = [];
      if (homeSystem) uniqueSystems.push({ idx: 0, sys: homeSystem, active: activeIdx === 0 });
      if (activeIdx > 0) uniqueSystems.push({ idx: activeIdx, sys: activeSystem, active: true });
      others.forEach(function(sys, i) {
        if (!sys || typeof sys !== 'object' || i === 0 || i === activeIdx) return;
        uniqueSystems.push({ idx: i, sys: sys, active: false });
      });

      let otherPlanets = 0;
      const types = {};
      uniqueSystems.forEach(function(entry) {
        const list = Array.isArray(entry.sys.planets) ? entry.sys.planets : [];
        if (!entry.active) otherPlanets += list.length;
        list.forEach(function(p) { if (p && p.type) types[p.type] = (types[p.type] || 0) + 1; });
      });

      const primes = [];
      uniqueSystems.forEach(function(entry) {
        const sys = entry.sys;
        if (!sys || (!sys.primeData && !sys.isPrime)) return;
        primes.push(Object.assign({
          scope: entry.active ? 'active' : (entry.idx === 0 ? 'home' : 'other'),
          index: entry.idx,
          active: entry.active,
          systemName: sys.name || ('Система ' + (entry.idx + 1))
        }, primeInfo(sys.primeData || {})));
      });
      const worldEvents = (Array.isArray(d.activeWorldEvents) ? d.activeWorldEvents : [])
        .filter(function(ev) { return ev && typeof ev === 'object'; })
        .map(function(ev) {
          const cfg = WORLD_EVENT_BY_ID[ev.id];
          return {
            id: ev.id,
            title: cfg ? cfg.title : ev.id,
            tier: ev.tier || (cfg ? cfg.tier : 'daily'),
            startedAt: num(ev.startedAt),
            endsAt: num(ev.endsAt),
            active: num(ev.endsAt) > now
          };
        });

      const invasions = (Array.isArray(d.invasions) ? d.invasions : [])
        .filter(function(inv) { return inv && typeof inv === 'object'; })
        .map(function(inv) {
          const ships = Array.isArray(inv.ships) ? inv.ships : [];
          const alive = ships.filter(function(s) { return s && !s.destroyed && num(s.hp, 1) > 0; }).length;
          return {
            id: inv.id || '',
            tierKey: inv.tierKey || 'raid',
            tierLabel: INVASION_TIERS[inv.tierKey] || inv.tierKey || '—',
            targetType: inv.targetType || 'system',
            systemIdx: num(inv.systemIdx),
            systemName: inv.systemName || '',
            planetName: inv.planetName || '',
            shipsAlive: alive,
            shipsTotal: num(inv.shipsTotal, ships.length),
            hp: num(inv.hp),
            maxHp: num(inv.maxHp, 200),
            spawnedAt: num(inv.spawnedAt),
            robberyEndsAt: num(inv.robberyEndsAt),
            destructionEndsAt: num(inv.destructionEndsAt)
          };
        });

      const trophyEffects = (Array.isArray(d.activeTrophyEffects) ? d.activeTrophyEffects : [])
        .filter(function(t) { return t && typeof t === 'object'; })
        .map(function(t) {
          return { type: t.type || '—', value: t.value, expiresAt: num(t.expiresAt), active: num(t.expiresAt) > now };
        });

      const debuff = (d.invasionDebuff && typeof d.invasionDebuff === 'object') ? d.invasionDebuff : {};
      const boosters = (d.boosters && typeof d.boosters === 'object') ? d.boosters : {};

      return {
        now: now,
        planets: planets,
        otherSystems: others,
        primes: primes,
        worldEvents: worldEvents,
        invasions: invasions,
        trophyEffects: trophyEffects,
        planetTypes: types,
        activeIdx: activeIdx,
        activePlanets: planets.length,
        homePlanets: (activeIdx === 0)
          ? planets.length
          : (others[0] && Array.isArray(others[0].planets) ? others[0].planets.length : 0),
        otherPlanets: otherPlanets,
        planetsCount: planets.length + otherPlanets,
        systemsCount: uniqueSystems.length,
        shieldUntil: num(d.shieldUntil),
        shieldActive: num(d.shieldUntil) > now,
        boosterUntil: num(boosters.incomeUntil),
        boosterActive: num(boosters.incomeUntil) > now,
        invasionDebuff: { pct: num(debuff.pct), until: num(debuff.until), active: num(debuff.until) > now },
        primeDebuffUntil: num(d.primeDebuffUntil),
        primeDebuffActive: num(d.primeDebuffUntil) > now,
        nightDefense: { level: num(d.nightDefenseLevel), until: num(d.nightDefenseExpiresAt), active: num(d.nightDefenseExpiresAt) > now },
        systemDamagedUntil: num(d.activeSystemDamagedUntil),
        activeRandomEvent: d.activeRandomEvent || null
      };
    }

    // ─── Рендер карточки ────────────────────────────────────────
    const TABS = [
      { id: 'overview',  title: '📊 Обзор' },
      { id: 'resources', title: '💰 Ресурсы' },
      { id: 'statuses',  title: '🧪 Статусы' },
      { id: 'phase',     title: '🌀 Фаза' },
      { id: 'prime',     title: '👑 Прайм' },
      { id: 'invasions', title: '⚔️ Вторжения' },
      { id: 'premium',   title: '⭐ Премиум' },
      { id: 'misc',      title: '⚙️ Прочее' }
    ];

    function render() {
      if (!cur) return;
      renderHead();
      renderTabs();
      const panes = document.getElementById('panes');
      const fn = PANES[activeTab] || PANES.overview;
      panes.innerHTML = fn();
    }

    function renderHead() {
      const d = cur.data;
      const name = d.playerName || 'Безымянный';
      document.getElementById('drawerName').innerHTML = esc(name) + presenceBadge(cur.presence);
      document.getElementById('drawerMeta').innerHTML = [
        'ID: <b>' + esc(cur.id) + '</b>',
        'Система: ' + esc(d.systemName || '—'),
        'Фаза: ' + esc(stageLabel(d.stage)),
        'Сейв: ' + esc(ago(cur.savedAt)),
        'v' + esc(num(cur.version)),
        '⏱ ' + esc(fmtDate(cur.savedAt))
      ].map(function(x) { return '<span>' + x + '</span>'; }).join('');
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = TABS.map(function(t) {
        return '<button class="tab' + (t.id === activeTab ? ' active' : '') + '" data-tab="' + t.id + '">' + t.title + '</button>';
      }).join('');
    }

    // ─── Поля-хелперы ──────────────────────────────────────────
    function inputField(label, attrs, value, hint) {
      return '<label class="field"><span>' + esc(label) + '</span>'
        + '<input ' + attrs + ' value="' + esc(value) + '">'
        + (hint ? '<span class="hint-badge">' + esc(hint) + '</span>' : '')
        + '</label>';
    }
    function selectField(label, attrs, options, value) {
      const opts = options.map(function(o) {
        return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(value) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('');
      return '<label class="field"><span>' + esc(label) + '</span><select ' + attrs + '>' + opts + '</select></label>';
    }
    function kv(key, value) {
      return '<div class="kv"><span class="k">' + esc(key) + '</span><span class="v">' + value + '</span></div>';
    }
    function stat(label, value, hint) {
      return '<div class="stat"><div class="label">' + esc(label) + '</div>'
        + '<div class="value">' + value + '</div>'
        + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
    }

    // ─── ПАНЕЛИ ────────────────────────────────────────────────
    const PANES = {
      overview: function() {
        const d = cur.data;
        const x = derive(d);
        const now = x.now;
        const statusChips = []
          .concat(x.shieldActive ? ['<span class="chip good">🛡 Щит · ' + esc(fmtDur(x.shieldUntil - now)) + '</span>'] : [])
          .concat(x.boosterActive ? ['<span class="chip good">⚡ Бустер ×2 · ' + esc(fmtDur(x.boosterUntil - now)) + '</span>'] : [])
          .concat(x.invasionDebuff.active ? ['<span class="chip bad">📉 Дебафф −' + Math.round(x.invasionDebuff.pct * 100) + '% · ' + esc(fmtDur(x.invasionDebuff.until - now)) + '</span>'] : [])
          .concat(x.primeDebuffActive ? ['<span class="chip warn">👑 Прайм −50% · ' + esc(fmtDur(x.primeDebuffUntil - now)) + '</span>'] : [])
          .concat(x.worldEvents.filter(function(e) { return e.active; }).map(function(e) {
            return '<span class="chip warn">' + esc(e.title) + ' · ' + esc(fmtDur(e.endsAt - now)) + '</span>';
          }))
          .concat(x.invasions.length ? ['<span class="chip bad">⚔️ Вторжений: ' + x.invasions.length + '</span>'] : [])
          .concat(x.nightDefense.active ? ['<span class="chip good">🛡 Оборона ур.' + x.nightDefense.level + ' · ' + esc(fmtDur(x.nightDefense.until - now)) + '</span>'] : [])
          .concat(x.trophyEffects.filter(function(t) { return t.active; }).map(function(t) {
            return '<span class="chip good">🎫 ' + esc(t.type) + ' · ' + esc(fmtDur(t.expiresAt - now)) + '</span>';
          }));

        const caps = cur.wallet || {};
        const spent = premiumTotals();

        return ''
          + '<div class="grid c4">'
          + stat('Пыль', esc(fmt(d.dust)), 'всего: ' + esc(fmt(d.dustTotal)))
          + stat('Энергия', esc(fmt(d.energy)), 'цив. ур. ' + esc(fmt(d.civLevel)))
          + stat('Металлы', esc(fmt(d.metalAmount)), 'флот: ' + esc(fmt(fleetTotal())))
          + stat('Планет / систем', esc(x.planetsCount) + ' / ' + esc(num(d.systems, 1)), 'галактик: ' + esc(num(d.galaxies, 1)))
          + '</div>'

          + '<div class="card" style="margin-top:14px;"><h3>Статусы сейчас</h3>'
          + (statusChips.length ? '<div class="chips">' + statusChips.join('') + '</div>' : '<div class="note">Активных эффектов нет.</div>')
          + '</div>'

          + '<div class="grid c2" style="margin-top:14px;">'
          + '<div class="card"><h3>Прогресс</h3>'

      prime: function() {
        const d = cur.data;
        const x = derive(d);
        const homeKey = d.primeSystem && d.primeSystem.objectKey ? d.primeSystem.objectKey : 'none';
        let homeBase = homeKey, homeLvl = '1';
        for (const base in PRIME_MAP) {
          if (PRIME_MAP[base].lvl2 === homeKey) { homeBase = base; homeLvl = '2'; }
          if (PRIME_MAP[base].lvl3 === homeKey) { homeBase = base; homeLvl = '3'; }
        }
        const objOptions = [{ value: 'none', label: 'Нет' }].concat(Object.keys(PRIME_OBJECTS).map(function(key) {
          return { value: key, label: PRIME_OBJECTS[key].name };
        }));
        const levelable = PRIME_MAP[homeBase] ? true : false;

        // Активный Прайм редактируется блоком выше; здесь — родная (когда активна другая
        // система) и остальные системы, чтобы не дублировать одну и ту же запись.
        const otherRows = x.primes.filter(function(p) { return !p.active; }).map(function(p) {
          const isHome = p.scope === 'home';
          return '<tr>'
            + '<td>#' + p.index + ' · ' + esc(p.systemName) + (isHome ? ' <span class="hint-badge">родная</span>' : '') + '</td>'
            + '<td>' + esc(p.objectName) + '</td>'
            + '<td>ур. ' + esc(p.level || 1) + '</td>'
            + '<td class="note">' + esc(p.objectKey) + '</td>'
            + '<td style="white-space:nowrap;">'
            + '<button class="btn-danger btn-sm" data-act="prime-other-remove-status" data-idx="' + p.index + '">Убрать статус</button>'
            + (isHome ? '' : ' <button class="btn-danger btn-sm" data-act="prime-other-delete" data-idx="' + p.index + '">Удалить систему</button>')
            + '</td></tr>';
        }).join('');

        return ''
          + '<div class="card"><h3>Прайм активной системы <span class="hint-badge">S.primeSystem</span></h3>'
          + '<div class="grid c3">'
          + selectField('Объект', 'data-act="prime-home-object"', objOptions, homeBase)
          + (levelable
              ? selectField('Уровень', 'data-act="prime-home-level"', [{ value: '1', label: '1' }, { value: '2', label: '2' }, { value: '3', label: '3' }], homeLvl)
              : '<div class="field"><span>Уровень</span><div class="note" style="padding:9px 0;">не применимо</div></div>')
          + (d.primeSystem && typeof d.primeSystem === 'object'

    // ─── Хелперы панелей ───────────────────────────────────────
    // Редкие поля, которые не вынесены в отдельные формы: правим одним JSON.
    function advancedFields(d) {
      return {
        activeEvent: d.activeEvent || null,
        lastEventAt: num(d.lastEventAt),
        lastRandomEvent: num(d.lastRandomEvent),
        activeRandomEvent: d.activeRandomEvent || null,
        lastDailyEventDay: num(d.lastDailyEventDay),
        lastWeeklyEventWeek: num(d.lastWeeklyEventWeek),
        weeklyEventPlan: d.weeklyEventPlan || null,
        lastIgnitionQuality: num(d.lastIgnitionQuality),
        assemblyCooldownUntil: num(d.assemblyCooldownUntil),
        primeLastHealedAt: num(d.primeLastHealedAt),
        primeCandidates: Array.isArray(d.primeCandidates) ? d.primeCandidates : [],
        cosmicTrail: d.cosmicTrail || null,
        galaxyZoomLevel: num(d.galaxyZoomLevel),
        galaxyFocus: d.galaxyFocus || null,
        galaxyManualLod: !!d.galaxyManualLod,
        systemShopProgress: d.systemShopProgress || {},
        systemShopBatch: num(d.systemShopBatch, 1),
        systemShopCost: d.systemShopCost || null,
        dailyProgress: d.dailyProgress || {},
        dailyClaimed: d.dailyClaimed || {},
        dailyDayIndex: num(d.dailyDayIndex),
        lastDailyReset: num(d.lastDailyReset),
        seenMinigame: d.seenMinigame || {},
        fleetActive: !!d.fleetActive,
        offlineAttacksDone: num(d.offlineAttacksDone),
        firstNightShieldUsed: !!d.firstNightShieldUsed,
        trophyContracts: Array.isArray(d.trophyContracts) ? d.trophyContracts : []
      };
    }
    function advancedFieldsJson(d) {
      try { return JSON.stringify(advancedFields(d), null, 2); }
      catch (e) { return '{}'; }
    }
    function fleetTotal() {
      const fleet = (cur && cur.data && cur.data.fleet) || {};
      return num(fleet.interceptor) + num(fleet.cruiser) + num(fleet.dreadnought);
    }
    function storageCap(res, lvl) {
      const level = Math.min(7, Math.max(1, num(lvl, 1)));
      const hours = [8, 16, 24, 36, 48, 60, 72][level - 1];
      if (res === 'dust') return 50000 * Math.pow(10, level - 1) * hours;
      if (res === 'energy') return 100000 * Math.pow(5, level - 1);
      if (res === 'civ') return 500 * Math.pow(3, level - 1);
      return 0;
    }
    function productLabel(key) {
      const map = { chest: 'Космический сундук', shield: 'Премиум Щит (24ч)', booster: 'Бустер дохода (2ч ×2)' };
      return map[key] || key || '—';
    }
    function normalizePurchase(p) {
      const src = (p && typeof p === 'object') ? p : {};
      return {
        product: src.product || '',
        stars: num(src.stars),
        paidAt: num(src.paidAt != null ? src.paidAt : src.paid_at),
        granted: !!src.granted
      };
    }
    function premiumTotals() {
      const list = (Array.isArray(cur && cur.purchases) ? cur.purchases : []).map(normalizePurchase);
      let stars = 0, last = 0;
      list.forEach(function(p) {
        stars += p.stars;
        if (p.paidAt > last) last = p.paidAt;
      });
      return { stars: stars, count: list.length, lastPaidAt: last };
    }
    function generateSystemName() {
      const prefixes = ['Альфа','Бета','Гамма','Дельта','Эпсилон','Дзета','Эта','Тета','Йота','Каппа','Лямбда','Мю','Ню','Кси','Омикрон','Пи','Ро','Сигма','Тау','Ипсилон','Фи','Хи','Пси','Омега'];
      const names = ['Кентавра','Центавра','Ориона','Лебедя','Лира','Дракона','Феникса','Кита','Гидры','Пегаса','Кассиопеи','Персея','Андромеды','Волопаса','Геркулеса','Змееносца','Ворона','Орла','Павлина','Журавля','Тукана','Единорога'];
      const suffixes = ['', ' I', ' II', ' III', ' IV', ' V', ' A', ' B'];
      return prefixes[Math.floor(Math.random() * prefixes.length)] + ' '
        + names[Math.floor(Math.random() * names.length)]
        + suffixes[Math.floor(Math.random() * suffixes.length)];
    }
    function getOrbitR(i) { return 170 * Math.pow(1.22, i); }
    function makePlanet(type, orbitR) {
      const mass = { rocky: 1.0, superEarth: 2.5, iceGiant: 4.0, gasGiant: 8.0, lava: 1.5 };
      const diam = { rocky: 1.0, superEarth: 1.3, iceGiant: 1.5, gasGiant: 1.8, lava: 0.9 };
      return {
        type: type,
        angle: Math.random() * Math.PI * 2,
        speed: 0.2 / Math.pow(orbitR / 90, 1.5),
        baseOrbitR: orbitR, orbitR: orbitR,
        driftPhase: Math.random() * Math.PI * 2,
        rotation: Math.random() * Math.PI * 2,
        seed: Math.random() * 1e6,
        forming: false, formUntil: 0,
        mass: mass[type] || 1.0, diameter: diam[type] || 1.0,
        moons: [], precession: 0, trueAnomaly: 0
      };
    }
    function makePrimeData(objKey) {
      const def = PRIME_OBJECTS[objKey];
      return {
        name: generateSystemName(),
        objectKey: objKey,
        objectName: def.name,
        objectIcon: def.icon,
        bonus: Object.assign({}, def.bonus),
        absorbRadius: def.absorbRadius,
        createdAt: Date.now()
      };
    }
    function makePerfectPrimeSystem(primeData) {
      const perfect = ['lava','lava','superEarth','superEarth','gasGiant','gasGiant','iceGiant','iceGiant'];
      const planets = perfect.map(function(type, i) { return makePlanet(type, getOrbitR(i)); });
      return {
        name: generateSystemName(),
        starType: 'G',
        systemType: 'single',
        planets: planets,
        isPrime: true,
        primeData: primeData
      };
    }
    function upgradePrimeData(existing, nextKey) {
      const def = PRIME_OBJECTS[nextKey];
      return Object.assign({}, existing, {
        objectKey: nextKey,
        objectName: def.name,
        objectIcon: def.icon,
        bonus: Object.assign({}, def.bonus),
        absorbRadius: def.absorbRadius
      });
    }
    function resolvePrimeKey(baseKey, level) {
      if (PRIME_MAP[baseKey]) {
        if (String(level) === '2') return PRIME_MAP[baseKey].lvl2;
        if (String(level) === '3') return PRIME_MAP[baseKey].lvl3;
      }
      return baseKey;
    }

    // ─── Действия ──────────────────────────────────────────────
    async function doAction(act, el) {
      const d = cur ? cur.data : null;
      if (!cur || !d) return;
      const now = Date.now();

      switch (act) {
        case 'shield': {
          const hours = num(el.dataset.hours);
          await saveField('shieldUntil', hours > 0 ? now + hours * 3600e3 : 0);
          return;
        }
        case 'shield-custom': {
          const hours = Math.max(0, num((document.getElementById('shieldCustomHours') || {}).value));
          await saveField('shieldUntil', hours > 0 ? now + hours * 3600e3 : 0);
          return;
        }
        case 'booster': {
          const hours = num(el.dataset.hours);
          await patch({ boosters: { incomeUntil: hours > 0 ? now + hours * 3600e3 : 0 } });
          return;
        }
        case 'booster-custom': {
          const hours = Math.max(0, num((document.getElementById('boosterCustomHours') || {}).value));
          await patch({ boosters: { incomeUntil: hours > 0 ? now + hours * 3600e3 : 0 } });
          return;
        }
        case 'debuff-set': {
          const p = Math.max(0, Math.min(80, num((document.getElementById('debuffPct') || {}).value))) / 100;
          const h = Math.max(0, num((document.getElementById('debuffHours') || {}).value));
          await saveField('invasionDebuff', { pct: p, until: h > 0 ? now + h * 3600e3 : 0 });
          return;
        }
        case 'debuff-clear': {
          await saveField('invasionDebuff', { pct: 0, until: 0 });
          return;
        }
        case 'prime-debuff-clear': {
          await saveField('primeDebuffUntil', 0);
          return;
        }
        case 'prime-debuff-set': {
          const h = Math.max(1, num((document.getElementById('primeDebuffHours') || {}).value));
          await saveField('primeDebuffUntil', now + h * 3600e3, 'Прайм-дебафф −50% на ' + h + ' ч');
          return;
        }
        case 'event-del': {
          const id = el.dataset.id;
          const list = (Array.isArray(d.activeWorldEvents) ? d.activeWorldEvents : []).filter(function(ev) { return ev && ev.id !== id; });
          await saveField('activeWorldEvents', list);
          return;
        }
        case 'event-add': {
          const pick = document.getElementById('eventPick');
          const hours = Math.max(1, num((document.getElementById('eventHours') || {}).value, 24));
          const id = pick ? pick.value : '';
          const cfg = WORLD_EVENT_BY_ID[id];
          if (!id || !cfg) { toast('Выберите событие', '', true); return; }
          const list = (Array.isArray(d.activeWorldEvents) ? d.activeWorldEvents : [])
            .filter(function(ev) { return ev && ev.id !== id; });
          list.push({ id: id, tier: cfg.tier, startedAt: now, endsAt: now + hours * 3600e3 });
          await saveField('activeWorldEvents', list);
          return;
        }
        case 'events-clear': {
          await saveField('activeWorldEvents', []);
          return;
        }
        case 'night-set': {
          const level = Math.max(0, num((document.getElementById('nightLevel') || {}).value));
          const h = Math.max(0, num((document.getElementById('nightHours') || {}).value));
          await patch({ nightDefenseLevel: level, nightDefenseExpiresAt: h > 0 ? now + h * 3600e3 : 0 });
          return;
        }
        case 'night-clear': {
          await patch({ nightDefenseLevel: 0, nightDefenseExpiresAt: 0 });
          return;
        }
        case 'trophy-del': {
          const idx = num(el.dataset.idx);
          const list = (Array.isArray(d.activeTrophyEffects) ? d.activeTrophyEffects : []).slice();
          list.splice(idx, 1);
          await saveField('activeTrophyEffects', list);
          return;
        }
        case 'trophy-add': {
          const typeEl = document.getElementById('trophyType');
          const type = typeEl ? typeEl.value : 'shield';
          const value = Math.max(0, num((document.getElementById('trophyValue') || {}).value));
          const hours = Math.max(1, num((document.getElementById('trophyHours') || {}).value, 12));
          const list = (Array.isArray(d.activeTrophyEffects) ? d.activeTrophyEffects.slice() : []);
          list.push({ type: type, value: value, expiresAt: now + hours * 3600e3 });
          await saveField('activeTrophyEffects', list, 'трофей ' + type + ' на ' + hours + ' ч');
          return;
        }
        case 'trophies-clear': {
          await patch({ activeTrophyEffects: [], trophyContracts: [] });
          return;
        }
        case 'system-damage-clear': {
          await saveField('activeSystemDamagedUntil', 0);
          return;
        }
        case 'random-event-clear': {
          await saveField('activeRandomEvent', null);
          return;
        }
        case 'all-status-clear': {
          await patch({
            shieldUntil: 0,
            boosters: { incomeUntil: 0 },
            invasionDebuff: { pct: 0, until: 0 },
            primeDebuffUntil: 0,
            activeWorldEvents: [],
            nightDefenseExpiresAt: 0,
            activeSystemDamagedUntil: 0,
            activeTrophyEffects: []
          }, 'щит, дебаффы и события сняты');
          return;
        }
        case 'add-res': {
          const field = el.dataset.field;
          const amount = num(el.dataset.amount);
          await saveField(field, num(d[field]) + amount);
          return;
        }
        case 'save-wallet': {
          const value = Math.max(0, num((document.getElementById('walletCapBudget') || {}).value));
          try {
            const res = await call('/admin/api/player/' + encodeURIComponent(cur.id) + '/wallet', {
              method: 'POST', body: { capBudget: value }
            });
            const json = await readJson(res);
            if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
            cur.wallet = json.wallet || cur.wallet;
            render();
            toast('Бюджет обновлён', String(value));
          } catch (e) {
            toast('Ошибка', e.message, true);
          }
          return;
        }
        case 'prime-home-remove': {
          await saveField('primeSystem', null);
          toast('Прайм снят');
          return;
        }
        case 'prime-create': {
          const sel = document.getElementById('newPrimeObject');
          const key = sel ? sel.value : 'blackHole';
          if (!PRIME_OBJECTS[key]) { toast('Неизвестный объект', key, true); return; }
          const others = (Array.isArray(d.otherSystems) ? d.otherSystems.slice() : []);
          while (others.length < 1) others.push(null);
          others.push(makePerfectPrimeSystem(makePrimeData(key)));
          await patch({
            otherSystems: others,
            systems: num(d.systems, 1) + 1,
            totalSystemsCreated: num(d.totalSystemsCreated, 1) + 1
          }, 'создана Прайм-система: ' + PRIME_OBJECTS[key].name);
          return;
        }
        case 'prime-other-remove-status': {
          const idx = num(el.dataset.idx);
          const others = (Array.isArray(d.otherSystems) ? d.otherSystems.slice() : []);
          if (!others[idx]) return;
          others[idx] = Object.assign({}, others[idx], { isPrime: false, primeData: null });
          await saveField('otherSystems', others);
          return;
        }
        case 'prime-other-delete': {
          const idx = num(el.dataset.idx);
          const others = (Array.isArray(d.otherSystems) ? d.otherSystems.slice() : []);
          if (!others[idx]) return;
          if (!confirm('Удалить систему «' + (others[idx].name || '#' + idx) + '» вместе с планетами?')) return;
          others.splice(idx, 1);
          const fields = {
            otherSystems: others,
            systems: Math.max(1, num(d.systems, 1) - 1)
          };
          if (num(d.activeSystemIdx) >= idx && num(d.activeSystemIdx) > 0) fields.activeSystemIdx = num(d.activeSystemIdx) - 1;
          await patch(fields, 'система удалена');
          return;
        }
        case 'invasion-del': {
          const id = el.dataset.id;
          const list = (Array.isArray(d.invasions) ? d.invasions : []).filter(function(inv) { return inv && String(inv.id) !== String(id); });
          await saveField('invasions', list, 'вторжение отменено');
          return;
        }
        case 'invasions-clear': {
          if (!confirm('Снять все вторжения?')) return;
          await saveField('invasions', []);
          return;
        }
        case 'invasion-add': {
          const sel = document.getElementById('invasionTier');
          const tier = sel ? sel.value : 'raid';
          try {
            const res = await call('/admin/api/player/' + encodeURIComponent(cur.id) + '/invasion', {
              method: 'POST', body: { tier: tier }
            });
            const json = await readJson(res);
            if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
            toast('Вторжение запущено', 'уровень: ' + (INVASION_TIERS[tier] || tier));
            await refreshPlayer();
          } catch (e) {
            toast('Ошибка', e.message, true);
          }
          return;
        }
        case 'grant-shield': {
          await saveField('shieldUntil', now + 24 * 3600e3);
          return;
        }
        case 'grant-booster': {
          await patch({ boosters: { incomeUntil: now + 2 * 3600e3 } });
          return;
        }
        case 'grant-chest': {
          await giveChest();
          return;
        }
        case 'daily-reset': {
          await saveField('dailyReward', { day: 0, lastClaimed: 0, lastClaimedDay: 0 });
          return;
        }
        case 'ach-clear': {
          await patch({ achievements: [], unlockedAch: {}, primeParts: 0, primeCrafts: 0 });
          return;
        }
        case 'anticheat-clear': {
          await saveField('anticheat', { flags: 0, reasons: [], ts: 0, prestiges: [] });
          return;
        }
        case 'eventlog-clear': {
          await patch({ eventLog: [], eventLogUnread: 0 });
          return;
        }
        case 'delete-player': {
          await deletePlayer();
          return;
        }
        case 'apply-json': {
          const el = document.getElementById('advancedJson');
          let parsed = null;
          try { parsed = JSON.parse(el ? el.value : '{}'); }
          catch (e) { toast('Некорректный JSON', e.message, true); return; }
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
            toast('Нужен JSON-объект', '', true);
            return;
          }
          const fields = {};
          Object.keys(parsed).forEach(function(key) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) return;
            if (key === '__proto__' || key === 'constructor' || key === 'prototype') return;
            fields[key] = parsed[key];
          });
          if (Object.keys(fields).length === 0) { toast('Нет валидных полей', '', true); return; }
          await patch(fields, 'доп. поля обновлены');
          return;
        }
        case 'reload-json': {
          render();
          toast('Показаны текущие значения');
          return;
        }
        default:
          return;
      }
    }

    // ─── Обработчики панелей ───────────────────────────────────
    function onPaneClick(event) {
      const btn = event.target.closest('button[data-act]');
      if (btn) {
        event.preventDefault();
        const act = btn.dataset.act;
        doAction(act, btn);
        return;
      }
      const tab = event.target.closest('[data-tab]');
      if (tab) {
        activeTab = tab.dataset.tab;
        render();
      }
    }

    function onPaneChange(event) {
      const el = event.target;
      if (!el || !el.dataset) return;
      if (!cur) return;
      const d = cur.data;
      const act = el.dataset.act;

      if (act === 'field') {
        const field = el.dataset.field;
        let value = el.value;
        if (el.type === 'number') value = num(value);
        saveField(field, value);
        return;
      }
      if (act === 'toggle-field') {
        saveField(el.dataset.field, el.value === 'true');
        return;
      }
      if (act === 'storage-lvl') {
        const res = el.dataset.res;
        const levels = Object.assign({ dust: 1, energy: 1, civ: 1 }, d.storageLevels || {});
        levels[res] = Math.max(1, Math.min(7, num(el.value, 1)));
        saveField('storageLevels', levels);
        return;
      }
      if (act === 'storage-progress') {
        const res = el.dataset.res;
        const progress = Object.assign({ dust: 0, energy: 0, civ: 0 }, d.storageProgress || {});
        progress[res] = Math.max(0, num(el.value));
        saveField('storageProgress', progress);
        return;
      }
      if (act === 'fleet') {
        const ship = el.dataset.ship;
        const fleet = Object.assign({ interceptor: 0, cruiser: 0, dreadnought: 0 }, d.fleet || {});
        fleet[ship] = Math.max(0, num(el.value));
        saveField('fleet', fleet);
        return;
      }
      if (act === 'phase-progress') {
        const key = el.dataset.key;
        const progress = Object.assign({ cloud: 0, condense: 0, protostar: 0 }, d.phaseProgress || {});
        progress[key] = Math.max(0, num(el.value));
        saveField('phaseProgress', progress);
        return;
      }
      if (act === 'prime-home-object') {
        const baseKey = el.value;
        if (baseKey === 'none') { saveField('primeSystem', null); return; }
        const levelEl = document.querySelector('[data-act="prime-home-level"]');
        const level = levelEl ? levelEl.value : '1';
        const key = resolvePrimeKey(baseKey, level);
        saveField('primeSystem', makePrimeData(key));
        return;
      }
      if (act === 'prime-home-level') {
        const objEl = document.querySelector('[data-act="prime-home-object"]');
        const baseKey = objEl ? objEl.value : 'blackHole';
        if (!PRIME_MAP[baseKey]) return;
        saveField('primeSystem', makePrimeData(resolvePrimeKey(baseKey, el.value)));
        return;
      }
      if (act === 'settings') {
        const settings = Object.assign({ brightness: 1, sound: true, pushEnabled: true }, d.settings || {});
        settings[el.dataset.key] = num(el.value);
        saveField('settings', settings);
        return;
      }
      if (act === 'settings-bool') {
        const settings = Object.assign({ brightness: 1, sound: true, pushEnabled: true }, d.settings || {});
        settings[el.dataset.key] = el.value === 'true';
        saveField('settings', settings);
        return;
      }
      if (act === 'night-config') {
        const night = Object.assign({ mode: 'balanced', defenseEnabled: true, cometHours: 0, expeditionPercent: 0 }, d.nightConfig || {});
        const key = el.dataset.key;
        night[key] = (key === 'mode') ? el.value : num(el.value);
        saveField('nightConfig', night);
        return;
      }
      if (act === 'night-bool') {
        const night = Object.assign({ mode: 'balanced', defenseEnabled: true, cometHours: 0, expeditionPercent: 0 }, d.nightConfig || {});
        night[el.dataset.key] = el.value === 'true';
        saveField('nightConfig', night);
        return;
      }
      if (act === 'daily') {
        const daily = Object.assign({ day: 0, lastClaimed: 0, lastClaimedDay: 0 }, d.dailyReward || {});
        daily[el.dataset.key] = Math.max(0, num(el.value));
        saveField('dailyReward', daily);
        return;
      }
      if (act === 'stats') {
        const stats = Object.assign({ comets: 0, expeditions: 0, invasionsDefeated: 0, clicks: 0, planets: 0, dailyClaims: 0 }, d.stats || {});
        stats[el.dataset.key] = Math.max(0, num(el.value));
        saveField('stats', stats);
        return;
      }
    }

    // ─── Сундук (клиентский ролл, как в игре) ───────────────────
    function pickChestKey() {
      const total = CHEST_LOOT.reduce(function(sum, item) { return sum + item.weight; }, 0);
      let roll = Math.random() * total;
      for (let i = 0; i < CHEST_LOOT.length; i++) {
        roll -= CHEST_LOOT[i].weight;
        if (roll <= 0) return CHEST_LOOT[i].key;
      }
      return CHEST_LOOT[CHEST_LOOT.length - 1].key;
    }

    async function giveChest() {
      if (!cur) return;
      if (!confirm('Выдать сундук? Выпадет случайный Прайм-объект (или слияние).')) return;
      const d = cur.data;
      const key = pickChestKey();
      const nextKey = CHEST_UPGRADES[key] || null;

      // 1) Такой объект уже в домашней системе — слияние.
      if (d.primeSystem && d.primeSystem.objectKey === key) {
        if (!nextKey) { toast('Выпал «' + PRIME_OBJECTS[key].name + '»', 'улучшать некуда', true); return; }
        await saveField('primeSystem', upgradePrimeData(d.primeSystem, nextKey), 'улучшен до ' + PRIME_OBJECTS[nextKey].name);
        return;
      }
      // 2) Такой объект есть в другой системе — слияние там.
      const systems = (Array.isArray(d.otherSystems) ? d.otherSystems.slice() : []);
      for (let i = 1; i < systems.length; i++) {
        const sys = systems[i];
        if (sys && sys.primeData && sys.primeData.objectKey === key && nextKey) {
          systems[i] = Object.assign({}, sys, { primeData: upgradePrimeData(sys.primeData, nextKey) });
          await saveField('otherSystems', systems, 'улучшен Прайм в системе «' + (sys.name || i) + '»');
          return;
        }
      }
      // 3) Новый Прайм — создаём идеальную систему.
      while (systems.length < 1) systems.push(null);
      systems.push(makePerfectPrimeSystem(makePrimeData(key)));
      await patch({
        otherSystems: systems,
        systems: num(d.systems, 1) + 1,
        totalSystemsCreated: num(d.totalSystemsCreated, 1) + 1
      }, 'выпал «' + PRIME_OBJECTS[key].name + '» — создана система');
    }

    // ─── Транзакции Stars ──────────────────────────────────────
    function openStarsModal() {
      document.getElementById('starsModal').classList.add('open');
      loadStars();
    }
    function closeStarsModal() {
      document.getElementById('starsModal').classList.remove('open');
    }
    async function loadStars() {
      const balanceEl = document.getElementById('starsBalance');
      const tbody = document.querySelector('#starsTable tbody');
      balanceEl.textContent = '…';
      tbody.innerHTML = '<tr><td colspan="4" class="empty">Загрузка…</td></tr>';
      try {
        const res = await call('/admin/api/stars');
        const json = await readJson(res);
        if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
        balanceEl.textContent = '⭐ ' + fmt(json.balance);
        const txs = Array.isArray(json.transactions) ? json.transactions : [];
        if (txs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty">Транзакций пока нет</td></tr>';
          return;
        }
        tbody.innerHTML = txs.map(function(t) {
          const src = t.source || {};
          const recv = t.receiver || {};
          const userId = (src.user && src.user.id) || (recv.user && recv.user.id) || '—';
          const product = t.productName || '—';
          const amount = num(t.amount);
          return '<tr>'
            + '<td>' + esc(t.date ? new Date(t.date * 1000).toLocaleString('ru-RU') : '—') + '</td>'
            + '<td>' + esc(userId) + '</td>'
            + '<td class="mono">' + esc((amount > 0 ? '+' : '') + amount) + '</td>'
            + '<td>' + esc(product) + '</td>'
            + '</tr>';
        }).join('');
      } catch (e) {
        balanceEl.textContent = '—';
        tbody.innerHTML = '<tr><td colspan="4" class="empty">Ошибка: ' + esc(e.message) + '</td></tr>';
      }
    }

    // ─── Удаление аккаунта ─────────────────────────────────────
    async function deletePlayer() {
      if (!cur) return;
      if (!confirm('Сбросить аккаунт игрока? Сейв и кошелёк будут удалены, при следующем входе игрок начнёт с нуля.')) return;
      try {
        const res = await call('/admin/api/player/' + encodeURIComponent(cur.id) + '/delete', { method: 'POST' });
        const json = await readJson(res);
        if (!res.ok || !json.ok) throw new Error(json.error || ('HTTP ' + res.status));
        toast('Аккаунт сброшен', 'при следующем входе игрок начнёт новую игру');
        document.getElementById('playerDrawer').classList.remove('open');
        cur = null;
        loadPlayers();
      } catch (e) {
        toast('Ошибка', e.message, true);
      }
    }

    // ─── Инициализация ─────────────────────────────────────────
    document.getElementById('tabs').addEventListener('click', onPaneClick);
    document.getElementById('panes').addEventListener('click', onPaneClick);
    document.getElementById('panes').addEventListener('change', onPaneChange);

    (function init() {
      if (token) {
        document.getElementById('adminToken').value = token;
        loadPlayers();
      }
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (document.getElementById('starsModal').classList.contains('open')) closeStarsModal();
          else if (document.getElementById('playerDrawer').classList.contains('open')) closePlayer();
        }
      });
    })();
  </script>
