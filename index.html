<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#02010a">
  <title>АККРЕЦИЯ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="sky" width="100%" height="100%"></canvas>

    <div class="hud">
      <div class="phase-orb" id="phaseOrb">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" class="orb-bg"/>
          <circle cx="50" cy="50" r="42" class="orb-progress" id="orbProgress"/>
        </svg>
        <span class="orb-label" id="orbLabel">I</span>
      </div>

      <div class="quests-panel" id="questsPanel"></div>
      <div class="missions" id="missions"></div>
      <div id="systemSwitcher"></div>
      <div id="gasIndicator" style="
        position:absolute;
        top:80px;
        left:12px;
        z-index:5;
        font-size:11px;
        font-weight:600;
        font-family:-apple-system, sans-serif;
        padding:4px 10px;
        background:rgba(15,10,32,0.7);
        border-radius:8px;
        border:1px solid rgba(139,127,212,0.3);
        display:none;
      "></div>

      <div class="spacer"></div>

      <button class="evolve-btn" id="evolveBtn">Эволюция</button>

      <div class="mission-buttons" id="missionButtons"></div>

      <div class="storage-panel" id="storagePanel">
        <div class="storage-cell" data-res="dust">
          <div class="storage-icon">✦</div>
          <div class="storage-val" id="dustVal">0</div>
          <div class="storage-label">ПЫЛЬ</div>
          <div class="storage-rate" id="dustRate">+0 / ч</div>
          <div class="storage-progress">
            <div class="storage-progress-fill" id="dustProgressFill"></div>
          </div>
          <div class="storage-progress-text" id="dustProgressText">0/0</div>
          <button class="storage-upgrade-btn" data-res="dust">Улучшить</button>
        </div>
        <div class="storage-cell" data-res="energy">
          <div class="storage-icon">⚡</div>
          <div class="storage-val" id="energyVal">0</div>
          <div class="storage-label">ЭНЕРГИЯ</div>
          <div class="storage-rate" id="energyRate">+0 / ч</div>
          <div class="storage-progress">
            <div class="storage-progress-fill" id="energyProgressFill"></div>
          </div>
          <div class="storage-progress-text" id="energyProgressText">0/0</div>
          <button class="storage-upgrade-btn" data-res="energy">Улучшить</button>
        </div>
        <div class="storage-cell" data-res="civ">
          <div class="storage-icon">🧬</div>
          <div class="storage-val" id="civVal">0</div>
          <div class="storage-label">ЦИВИЛИЗАЦИЯ</div>
          <div class="storage-rate" id="civRate">+0 / ч</div>
          <div class="storage-progress">
            <div class="storage-progress-fill" id="civProgressFill"></div>
          </div>
          <div class="storage-progress-text" id="civProgressText">0/0</div>
          <button class="storage-upgrade-btn" data-res="civ">Улучшить</button>
        </div>
        <div class="storage-cell" data-res="systems">
          <div class="storage-icon">🌌</div>
          <div class="storage-val" id="systemsVal">1</div>
          <div class="storage-label">СИСТЕМ</div>
        </div>
        <div class="storage-cell" data-res="metals">
          <div class="storage-icon">⚙</div>
          <div class="storage-val" id="metalsVal">0</div>
          <div class="storage-label">МЕТАЛЛЫ</div>
          <div class="storage-rate" id="metalsRate">+0 / сек</div>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <div class="test-buttons">
      <button class="turbo" id="turbo" title="Turbo (тест)">🚀</button>
      <button class="reset-btn" id="resetBtn" title="Сброс прогресса">⟲</button>
    </div>

    <button id="backToGalaxyBtn" style="display:none; position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:10; background:rgba(107,77,230,0.85); border:1px solid rgba(185,168,255,0.5); color:#fff; padding:8px 16px; border-radius:12px; font-weight:bold; font-family:inherit; cursor:pointer;">🌌 В галактику</button>
    <div class="system-buttons">
      <button class="event-btn" id="eventBtn" title="Журнал событий">
        📜<span class="event-badge" id="eventBadge" style="display:none">0</span>
      </button>
      <button class="settings-btn" id="settingsBtn" title="Настройки">⚙</button>
      <button class="view3d-btn" id="view3dBtn" title="3D-обзор">🌐</button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-title">⚙ Настройки</div>
      <div class="modal-sub">Настрой интерфейс под себя</div>
      
      <div class="info-box" style="margin-top: 15px;">
        <!-- Яркость -->
        <div class="row-stat" style="align-items: center;">
          <span>☀️ Яркость</span>
          <input type="range" id="brightnessSlider" min="0.4" max="1.5" step="0.1" style="width: 60%; accent-color: #8b5cf6;">
        </div>
        
        <!-- Звук -->
        <div class="row-stat" style="align-items: center;">
          <span>🔊 Звук</span>
          <button class="pour-btn" id="soundToggleBtn" style="padding: 4px 12px;">Вкл</button>
        </div>
      </div>

      <button class="stars-btn" id="settingsResetBtn" style="background: linear-gradient(135deg, #ff5e5e, #ff2a2a); color: #fff; margin-top: 20px;">
        ⚠️ Сбросить прогресс
      </button>
      
      <button class="pour-btn" style="width: 100%; margin-top: 10px;" onclick="document.getElementById('settingsModal').classList.remove('show');">
        Закрыть
      </button>
    </div>
  </div>
  <div class="modal" id="eventLogModal">
    <div class="modal-card event-log-card">
      <div class="modal-title">📜 Журнал событий</div>
      <div class="modal-sub">Последние 100 событий · сохраняется между сессиями</div>
      <div class="event-log-body" id="eventLogBody"></div>
    </div>
  </div>

  <!-- Подключение модулей (порядок важен!) -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/planets.js"></script>
  <script src="js/invasions.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/evolution.js"></script>
  <script src="js/lore.js"></script>
  <script src="js/prestige.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/anticheat.js"></script>
  <script src="js/prime.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/eventlog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
